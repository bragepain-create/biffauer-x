<script>
if (!window.storage) {
  try {
    window.storage = {
      get: async function(key) { var v = localStorage.getItem('bx_'+key); if(!v) throw new Error('not found'); return {key:key, value: v}; },
      set: async function(key, value) { localStorage.setItem('bx_'+key, value); return {key:key, value: value}; },
      delete: async function(key) { localStorage.removeItem('bx_'+key); return {key:key, deleted: true}; },
      list: async function(prefix) { var keys = []; for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('bx_'+(prefix||''))===0)keys.push(k.replace('bx_',''));} return {keys:keys}; }
    };
  } catch(e) {
    var store = {};
    window.storage = {
      get: async function(key) { if(!store[key]) throw new Error('not found'); return {key:key, value: store[key]}; },
      set: async function(key, value) { store[key] = value; return {key:key, value: value}; },
      delete: async function(key) { delete store[key]; return {key:key, deleted: true}; },
      list: async function(prefix) { return {keys: Object.keys(store).filter(function(k){ return !prefix || k.indexOf(prefix)===0; })}; }
    };
  }
}
</script>

function BiffauerX(){
  const canvRef=useRef(null);
  const gRef=useRef(null);
  const spdRef=useRef(1);
  const [ui,setUi]=useState({
    phase:"menu",money:0,hp:100,wave:0,kills:0,intel:0,dia:0,
    floors:[[null,null,null,null,null],[null,null,null,null,null],[null,null,null,null,null]],
    melees:[null,null,null,null],bldgs:[null,null,null,null,null],
    wA:false,shop:null,selB:null,classPick:null,classSkills:[],classSkillPts:0,
    showTree:false,showDiaTree:false,diaUps:{},spd:1,sandbox:false,sandbox_panel:false,
    activeSlot:null,savesLoaded:false
  });

  const g=gRef.current;

  useEffect(()=>{
    const c=canvRef.current;
    if(!c)return;
    c.width=W;c.height=H;
    const ctx=c.getContext("2d");
    let af=null;
    const draw=()=>{
      ctx.fillStyle="#010409";ctx.fillRect(0,0,W,H);
      // Castle
      ctx.fillStyle="#1a1a2a";ctx.fillRect(CX-30,GY-100,60,100);
      ctx.fillStyle="#2a2a3a";ctx.fillRect(CX-25,GY-95,50,40);
      ctx.fillStyle="#ffd54f";ctx.font="30px serif";ctx.textAlign="center";ctx.fillText("🏰",CX,GY-60);
      // Ground
      ctx.fillStyle="#0d1117";ctx.fillRect(0,GY,W,H-GY);
      // Floors
      for(let i=0;i<3;i++){
        const y=Math.round(H*(0.57-i*0.13));
        ctx.strokeStyle="rgba(139,148,158,0.15)";ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(200,y);ctx.stroke();
      }
      // Melee line
      const my=Math.round(H*0.72);
      ctx.strokeStyle="rgba(255,165,0,0.2)";ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(180,my);ctx.lineTo(W-20,my);ctx.stroke();
      ctx.setLineDash([]);
      if(g){
        // Projectiles
        (g.projs||[]).forEach(p=>{
          ctx.fillStyle=p.c||"#ffd54f";
          ctx.beginPath();ctx.arc(p.x,p.y,p.sz||3,0,Math.PI*2);ctx.fill();
        });
        // Enemies
        (g.enms||[]).forEach(e=>{
          ctx.fillStyle=e.c;
          ctx.beginPath();ctx.arc(e.x,e.y,e.sz,0,Math.PI*2);ctx.fill();
          if(e.ar>0){
            ctx.strokeStyle="rgba(255,255,255,0.3)";ctx.lineWidth=2;
            ctx.beginPath();ctx.arc(e.x,e.y,e.sz+2,0,Math.PI*2);ctx.stroke();
          }
          // HP bar
          const hpP=e.hp/e.mhp;
          ctx.fillStyle="#222";ctx.fillRect(e.x-e.sz,e.y-e.sz-8,e.sz*2,3);
          ctx.fillStyle=hpP>0.5?"#66bb6a":hpP>0.25?"#ffa726":"#ef5350";
          ctx.fillRect(e.x-e.sz,e.y-e.sz-8,e.sz*2*hpP,3);
        });
        // Explosions
        (g.expls||[]).forEach(ex=>{
          const a=1-ex.t/ex.dur;
          ctx.fillStyle=`rgba(255,100,50,${a*0.6})`;
          ctx.beginPath();ctx.arc(ex.x,ex.y,ex.r*(1-a*0.5),0,Math.PI*2);ctx.fill();
        });
        // Heroes
        [...(g.flrH||[]),...(g.melH||[])].forEach(h=>{
          if(h.hp<=0)return;
          ctx.fillStyle=h.c;
          ctx.beginPath();ctx.arc(h.x,h.y,h.sz,0,Math.PI*2);ctx.fill();
          if(h.tEn){
            ctx.strokeStyle="rgba(255,100,100,0.4)";ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(h.x,h.y);ctx.lineTo(h.tEn.x,h.tEn.y);ctx.stroke();
          }
        });
      }
      af=requestAnimationFrame(draw);
    };
    draw();
    return()=>{if(af)cancelAnimationFrame(af);};
  },[g]);

  const tick=useCallback(()=>{
    if(!g||!g.wA)return;
    const dt=16.67/1000*spdRef.current;
    // Move enemies
    g.enms.forEach(e=>{
      e.x-=e.spd*60*dt;
      if(e.x<CX){
        const dmg=Math.max(1,10-g.cAr);
        g.cHP-=dmg;
        e.hp=0;
      }
      if(e.dotT>0){
        e.dotT-=dt;
        if(e.dotT<=0){e.hp-=e.dotD;e.dotT=0.5;}
      }
      if(e.stnT>0){e.stnT-=dt;e.spd=e.spd0*0.3;}else{e.spd=e.spd0;}
      if(e.slT>0){e.slT-=dt;e.spd=e.spd0*0.5;}else if(e.stnT<=0){e.spd=e.spd0;}
    });
    g.enms=g.enms.filter(e=>e.hp>0&&e.x>-50);
    // Spawn enemies
    if(g.enms.length<g.maxE&&Math.random()<0.02*spdRef.current){
      const era=getEra(g.wave);
      // Filter fiender basert på era
      const availEnms=Object.entries(ENMS).filter(([k,v])=>v.era===era);
      if(availEnms.length>0){
        const [ek,ev]=pk(availEnms);
        const hpM=1+(g.wave-ERAS[era].waves[0])*0.1;
        g.enms.push({
          x:W+20,y:rn(GY-200,GY-30),spd:ev.spd,spd0:ev.spd,
          hp:ev.hp*hpM,mhp:ev.hp*hpM,sz:ev.sz,c:ev.c,mon:ev.mon,
          ar:ev.ar||0,hl:ev.hl||0,dotT:0,dotD:0,stnT:0,slT:0
        });
      }
    }
    // Heroes shoot
    [...g.flrH,...g.melH].forEach(h=>{
      if(h.hp<=0)return;
      h.cd-=dt;
      if(h.cd<=0){
        const w=WPNS[h.wpn];
        if(!w)return;
        // Check if weapon is available in current era
        const era=getEra(g.wave);
        if(w.era!==undefined && w.era>era){
          // Weapon not unlocked yet, skip
          return;
        }
        let tgt=null;
        if(w.hl){
          const allies=[...g.flrH,...g.melH].filter(a=>a.hp>0&&a.hp<a.mhp&&D(h.x,h.y,a.x,a.y)<w.r);
          if(allies.length>0)tgt=allies[0];
        }else{
          const inR=g.enms.filter(e=>D(h.x,h.y,e.x,e.y)<w.r*h.rngM);
          if(inR.length>0)tgt=inR[0];
        }
        if(tgt){
          h.tEn=tgt;
          if(w.m){
            let dmg=w.d*h.dmgM;
            if(w.hl){tgt.hp=Math.min(tgt.mhp,tgt.hp+dmg);}
            else{
              dmg=Math.max(1,dmg-tgt.ar);
              tgt.hp-=dmg;
              if(w.dot)tgt.dotD=w.dot;
            }
          }else{
            g.projs.push({x:h.x,y:h.y,tx:tgt.x,ty:tgt.y,spd:w.sp||8,dmg:w.d*h.dmgM,spl:w.spl?w.spl*h.splM:0,c:h.c,sz:3,dot:w.dot||0,stn:w.stn||0,sl:w.sl||0,hl:w.hl||0,tgt});
          }
          if(w.am<99)h.ammo--;
          h.cd=(w.rt/60)*h.rtM;
        }
      }
    });
    // Move projectiles
    g.projs.forEach(p=>{
      const dx=p.tx-p.x,dy=p.ty-p.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<5||!p.tgt||p.tgt.hp<=0){
        if(p.spl>0){
          g.expls.push({x:p.x,y:p.y,r:p.spl,t:0,dur:0.3});
          g.enms.forEach(e=>{if(D(p.x,p.y,e.x,e.y)<p.spl){let d=Math.max(1,p.dmg-e.ar);e.hp-=d;if(p.dot)e.dotD=p.dot;if(p.stn)e.stnT=p.stn/60;if(p.sl)e.slT=p.sl/60;}});
        }else if(p.tgt&&p.tgt.hp>0){
          if(p.hl){p.tgt.hp=Math.min(p.tgt.mhp,p.tgt.hp+p.dmg);}
          else{let d=Math.max(1,p.dmg-p.tgt.ar);p.tgt.hp-=d;if(p.dot)p.tgt.dotD=p.dot;if(p.stn)p.tgt.stnT=p.stn/60;if(p.sl)p.tgt.slT=p.sl/60;}
        }
        p.dead=true;
      }else{p.x+=dx/dist*p.spd*60*dt;p.y+=dy/dist*p.spd*60*dt;}
    });
    g.projs=g.projs.filter(p=>!p.dead);
    // Explosions
    g.expls.forEach(ex=>ex.t+=dt);
    g.expls=g.expls.filter(ex=>ex.t<ex.dur);
    // Check wave end
    if(g.enms.length===0&&g.spT<=0&&g.wA){
      g.wA=false;
      const mon=50+g.wave*10;
      const intel=5+g.wave*2;
      g.money+=mon*(1+g.monB);
      g.intel+=intel*(1+g.intB);
      if(g.wave%10===0)g.dia+=1;
      setUi(u=>({...u,wA:false,money:Math.round(g.money),intel:Math.round(g.intel),dia:g.dia,wave:g.wave,kills:u.kills+g.kills}));
      g.kills=0;
      [...g.flrH,...g.melH].forEach(h=>{if(h.hp<=0){h.respT=30;h.hp=0;}else{h.hp=Math.min(h.mhp,h.hp+h.mhp*0.2);}});
    }else if(g.wA){
      g.spT-=dt;
    }
    // Respawn
    [...g.flrH,...g.melH].forEach(h=>{if(h.respT>0){h.respT-=dt;if(h.respT<=0){h.hp=h.mhp;h.respT=0;}}});
    // Update UI
    setUi(u=>({...u,hp:Math.round(g.cHP)}));
    if(g.cHP<=0){g.wA=false;alert("Slottet ditt falt! Game Over");setUi(u=>({...u,phase:"menu",wA:false}));}
  },[g]);

        <div style={{display:"flex",gap:4,flex:1,flexWrap:"wrap",alignItems:"flex-end"}}>
          <button onClick={upgC} disabled={!g||ui.money<g?.cUC} style={{...ovBtn,padding:"7px 9px",fontSize:11,flexDirection:"column",background:g&&ui.money>=g?.cUC?"rgba(21,101,192,0.9)":"rgba(20,20,30,0.8)",color:g&&ui.money>=g?.cUC?"#fff":"#333"}}>🏰<br/><span style={{fontSize:9}}>{g?.cUC}💰</span></button>
          <button onClick={upgA} disabled={!g||ui.money<g?.cAU} style={{...ovBtn,padding:"7px 9px",fontSize:11,flexDirection:"column",background:g&&ui.money>=g?.cAU?"rgba(69,39,160,0.9)":"rgba(20,20,30,0.8)",color:g&&ui.money>=g?.cAU?"#fff":"#333"}}>⚔<br/><span style={{fontSize:9}}>{g?.cAU}💰</span></button>
          <button onClick={addM} disabled={!g||ui.money<g?.mUC} style={{...ovBtn,padding:"7px 9px",fontSize:11,flexDirection:"column",background:g&&ui.money>=g?.mUC?"rgba(121,85,72,0.9)":"rgba(20,20,30,0.8)",color:g&&ui.money>=g?.mUC?"#fff":"#333"}}>🛡<br/><span style={{fontSize:9}}>{g?.mUC}💰</span></button>
          {ui.bldgs.map((b,i)=>(<button key={`b${i}`} onClick={()=>setUi(u=>({...u,selB:u.selB===i?null:i,shop:null}))}
            style={{...ovBtn,padding:"7px 9px",fontSize:14,flexDirection:"column",background:ui.selB===i?"rgba(171,71,188,0.5)":b?"rgba(60,50,40,0.85)":"rgba(20,20,30,0.8)",color:"#e6edf3",border:ui.selB===i?"1px solid #ab47bc":"1px solid rgba(255,255,255,0.06)"}}>
            {b?BLDGS[b.id].icon:"🏗"}<br/><span style={{fontSize:8,color:"#666"}}>{b?`Lv${b.lvl}`:"bygg"}</span>
          </button>))}
          <button onClick={()=>setUi(u=>({...u,showDiaTree:!u.showDiaTree,showTree:false,shop:null}))}
            style={{...ovBtn,padding:"7px 9px",fontSize:14,flexDirection:"column",background:ui.showDiaTree?"rgba(100,50,180,0.7)":"rgba(20,15,40,0.85)",color:"#b388ff",border:`1px solid ${ui.dia>0?"#b388ff40":"#1a1a2a"}`}}>
            💎<br/><span style={{fontSize:8,color:"#b388ff"}}>{ui.dia} dia</span>
          </button>
          {ui.classPick&&<button onClick={()=>setUi(u=>({...u,showTree:!u.showTree,shop:null,showDiaTree:false}))}
            style={{...ovBtn,padding:"7px 9px",fontSize:11,flexDirection:"column",background:"rgba(50,30,80,0.85)",color:CLASSES[ui.classPick]?.c||"#fff",border:`1px solid ${CLASSES[ui.classPick]?.c||"#333"}40`}}>
            🌳<br/><span style={{fontSize:9}}>{(ui.classSkills||[]).length}/48{ui.classSkillPts>0?` 🌟${ui.classSkillPts}`:""}</span>
          </button>}
          <button onClick={retryWave} disabled={ui.wA||ui.wave<1} style={{...ovBtn,padding:"7px 9px",fontSize:11,flexDirection:"column",background:"rgba(230,81,0,0.8)",color:"#fff",opacity:ui.wA||ui.wave<1?0.3:1}}>↩<br/><span style={{fontSize:9}}>Tilbake</span></button>
        </div>
        <button onClick={startWave} disabled={ui.wA} style={{...ovBtn,padding:"14px 18px",fontSize:16,fontWeight:900,background:ui.wA?"rgba(30,30,40,0.9)":"linear-gradient(135deg,#c62828,#ef5350)",color:ui.wA?"#444":"#fff",borderRadius:14,boxShadow:ui.wA?"none":"0 4px 20px rgba(198,40,40,0.5)",border:"none",flexShrink:0,minWidth:100,flexDirection:"column"}}>
          {ui.wA?<>⚔<br/>PÅGÅR</>:<>⚔<br/>BØLGE {ui.wave+1}</>}
        </button>
      </div>
      {/* Building popup */}
      {ui.selB!=null&&!ui.bldgs[ui.selB]&&(
        <div style={{position:"absolute",bottom:90,left:8,background:"rgba(8,10,18,0.97)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:10,minWidth:180,backdropFilter:"blur(8px)",zIndex:5}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>🏗 Velg Bygning</div>
          {Object.entries(BLDGS).map(([k,b])=>(<button key={k} onClick={()=>{placeBldg(ui.selB,k);setUi(u=>({...u,selB:null}));}} disabled={ui.money<b.bc}
            style={{...ovBtn,justifyContent:"flex-start",width:"100%",padding:"6px 8px",fontSize:13,background:ui.money>=b.bc?"rgba(255,255,255,0.05)":"transparent",color:ui.money>=b.bc?"#e6edf3":"#333",border:"1px solid rgba(255,255,255,0.06)",borderRadius:8,marginBottom:3,opacity:ui.money>=b.bc?1:0.4}}>
            <span style={{fontSize:16}}>{b.icon}</span><span style={{flex:1}}>{b.n}</span><span style={{color:"#ffa726",fontSize:12}}>{b.bc}💰</span>
          </button>))}
        </div>
      )}
      {ui.selB!=null&&ui.bldgs[ui.selB]&&(()=>{const b=ui.bldgs[ui.selB],def=BLDGS[b.id],cost=~~(def.bc*(1+b.lvl*0.5));return(
        <div style={{position:"absolute",bottom:90,left:8,background:"rgba(8,10,18,0.97)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:12,minWidth:160,backdropFilter:"blur(8px)",zIndex:5}}>
          <div style={{fontSize:14,fontWeight:700}}>{def.icon} {def.n} Lv{b.lvl}</div>
          <div style={{fontSize:12,color:"#8b949e",margin:"4px 0"}}>{def.ud(b.lvl)}</div>
          {b.lvl<def.mx&&<button onClick={()=>upgBldg(ui.selB)} disabled={ui.money<cost} style={{...ovBtn,width:"100%",padding:8,fontSize:13,background:ui.money>=cost?"rgba(21,101,192,0.8)":"#1a1a2a",color:ui.money>=cost?"#fff":"#444",marginBottom:4}}>⬆ Lv{b.lvl+1} ({cost}💰)</button>}
          <button onClick={()=>setUi(u=>({...u,selB:null}))} style={{...ovBtn,width:"100%",padding:6,fontSize:12,background:"transparent",color:"#555",border:"1px solid #222"}}>✕ Lukk</button>
        </div>);})()}
      {/* Floor + melee slot buttons overlaid on canvas */}
      {!showPopup&&<>
        {ui.floors.map((fl,fi)=>fl.map((s,si)=>{
          const sx=18+si*22,sy=Math.round(H*(0.57-fi*0.13));
          return(<button key={`fs${fi}${si}`} onClick={()=>setUi(u=>({...u,shop:{fi,si,isM:false},selB:null}))}
            style={{position:"absolute",left:sx,top:sy,width:36,height:26,border:s?`2px solid ${HEROES[s.type]?.c}80`:"1px dashed rgba(255,255,255,0.2)",borderRadius:6,background:s?"rgba(0,0,0,0.65)":"rgba(0,0,0,0.3)",cursor:"pointer",color:"#e6edf3",fontFamily:FN,fontSize:9,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:0,zIndex:3}}>
            {s?<><div style={{width:7,height:7,borderRadius:"50%",background:HEROES[s.type]?.c,boxShadow:`0 0 4px ${HEROES[s.type]?.c}`}}/><div style={{fontSize:8,fontWeight:700,color:HEROES[s.type]?.c}}>{HEROES[s.type]?.n?.slice(0,4)}</div></>:<span style={{color:"rgba(255,255,255,0.25)",fontSize:14}}>+</span>}
          </button>);}))}
        {ui.melees.map((s,i)=>{
          const mx=200+i*44,my=Math.round(H*0.72);
          return(<button key={`ms${i}`} onClick={()=>setUi(u=>({...u,shop:{fi:0,si:i,isM:true},selB:null}))}
            style={{position:"absolute",left:mx,top:my,width:38,height:26,border:s?`2px solid ${HEROES[s.type]?.c}80`:"1px dashed rgba(255,165,0,0.3)",borderRadius:6,background:s?"rgba(0,0,0,0.65)":"rgba(0,0,0,0.3)",cursor:"pointer",color:"#e6edf3",fontFamily:FN,fontSize:9,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:0,zIndex:3}}>
            {s?<><div style={{width:7,height:7,borderRadius:"50%",background:HEROES[s.type]?.c}}/><div style={{fontSize:8,color:s.hp>0?"#ffd54f":"#ef5350"}}>{s.hp>0?`Lv${s.level}`:"⏳"}</div></>:<span style={{color:"rgba(255,165,0,0.3)",fontSize:14}}>+</span>}
          </button>);})}
      </>}
      {/* POPUP OVERLAY */}
      {showPopup&&(<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.65)",backdropFilter:"blur(2px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10,padding:12}}>
        <div style={{background:"rgba(8,10,18,0.98)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:16,padding:16,width:"min(420px,95vw)",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 8px 40px rgba(0,0,0,0.8)"}}>
          <button onClick={closeShop} style={{...ovBtn,float:"right",padding:"4px 10px",fontSize:14,background:"rgba(255,255,255,0.06)",color:"#666",borderRadius:8,border:"1px solid #222",marginBottom:8,cursor:"pointer"}}>✕</button>
          {ui.sandbox_panel?renderSandbox():showCastleUpgPopup?renderCastleUpgrade():ui.showDiaTree?renderDiaTree():ui.showTree&&ui.classPick?renderSkillTree():shopTarget?renderShopPopup():(!ui.classPick&&ui.wave>=2)?renderClassPicker():null}
        </div>
      </div>)}
      {/* Speed */}
      <button onClick={()=>{spdRef.current=spdRef.current>=4?1:spdRef.current*2;setUi(u=>({...u,spd:spdRef.current}));}} style={{position:"absolute",bottom:70,right:8,background:"rgba(0,0,0,0.75)",border:"1px solid #ffd54f",borderRadius:10,padding:"6px 12px",color:"#ffd54f",fontWeight:900,fontSize:15,cursor:"pointer",fontFamily:FN}}>⚡{ui.spd||1}x</button>
      {!ui.wA&&ui.wave===0&&<div style={{position:"absolute",top:"45%",left:"50%",transform:"translate(-50%,-50%)",color:"rgba(255,255,255,0.2)",fontSize:15,fontWeight:700,pointerEvents:"none",textAlign:"center"}}>Trykk BØLGE for å starte</div>}
    </div>);
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(BiffauerX));
</script>
</body>
</html>
