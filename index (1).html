// Storage polyfill
if (!window.storage) {
  try {
    window.storage = {
      get: async function(key) { var v = localStorage.getItem('bx_'+key); if(!v) throw new Error('not found'); return {key:key, value: v}; },
      set: async function(key, value) { localStorage.setItem('bx_'+key, value); return {key:key, value: value}; },
      delete: async function(key) { localStorage.removeItem('bx_'+key); return {key:key, deleted: true}; },
      list: async function(prefix) { var keys = []; for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('bx_'+(prefix||''))===0)keys.push(k.replace('bx_',''));} return {keys:keys}; }
    };
  } catch(e) {
    var store = {};
    window.storage = {
      get: async function(key) { if(!store[key]) throw new Error('not found'); return {key:key, value: store[key]}; },
      set: async function(key, value) { store[key] = value; return {key:key, value: value}; },
      delete: async function(key) { delete store[key]; return {key:key, deleted: true}; },
      list: async function(prefix) { return {keys: Object.keys(store).filter(function(k){ return !prefix || k.indexOf(prefix)===0; })}; }
    };
  }
}
</script>

function applySkills(hero,g){
  const hd=HEROES[hero.type];
  let dmgB=0,frB=0,rngB=0,hpB=0,spdB=0;
  // Class tree bonuses (from global state)
  if(g&&g.classPick&&hd.cls===g.classPick){
    const tree=getClassTree(g.classPick);
    for(const sid of (g.classSkills||[])){const node=tree.find(n=>n.id===sid);if(!node)continue;const e=node.ef;
      if(e.dmgP)dmgB+=e.dmgP;if(e.frP)frB+=e.frP;if(e.rngP)rngB+=e.rngP;if(e.hpP)hpB+=e.hpP;if(e.spdP)spdB+=e.spdP;
      if(e.dotP)hero.dotH=(hero.dotH||0)+e.dotP;if(e.critP)hero.crit=(hero.crit||0)+e.critP;
      if(e.pierceP)hero.pierce=1;if(e.slowP)hero.slow=(hero.slow||0)+e.slowP;
      if(e.splP)hero.splash=(hero.splash||0)+e.splP;if(e.chainP)hero.chain=(hero.chain||0)+e.chainP;
      if(e.drainP)hero.drain=1;if(e.armP)hero.armor=(hero.armor||0)+e.armP;
      if(e.healP)hero.healBonus=(hero.healBonus||0)+e.healP/100;

      if(e.castleP)hero.castleHpB=(hero.castleHpB||0)+e.castleP;
      if(e.stunP)hero.stunH=(hero.stunH||0)+e.stunP;
      if(e.teamDmgP)hero.teamDmg=(hero.teamDmg||0)+e.teamDmgP;
    }}
  const baseDmg=hd.dmg*(1+hero.level*0.35)*(hero.diaLvl>=1?1+hero.diaLvl*0.35:1);
  hero.damage=~~(baseDmg*(1+dmgB/100));
  hero.fireRate=Math.max(3,~~((hd.fr-hero.level*2)*(1-frB/200)));

    hero.maxHp=~~(baseHp*(1+hpB/100));hero.hp=Math.min(hero.hp,hero.maxHp);}
  if(hero.spd)hero.spd=(hd.spd||1.5)*(1+spdB/100);

const spriteCache={};
function getSprite(key,w,h,drawFn){
  if(spriteCache[key])return spriteCache[key];
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");drawFn(x,w,h);
  spriteCache[key]=c;return c;
}

// Pixel helper: draw a filled rect at pixel art scale
function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function pxc(ctx,x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}

      for(let ty=sh*0.3;ty<sh*0.64;ty++){const tw=sw*0.22*sz*Math.sin((ty-sh*0.3)/(sh*0.34)*Math.PI);
        px(ctx,cx-tw,ty,tw*2,1,bc);px(ctx,cx-tw,ty,1,1,lt(bc,15));}

      px(ctx,cx+sw*0.2,sh*0.32,sw*0.08,sh*0.25,era>=3?"#37474f":bc);
      // Hands
      const handC=era>=3?"#cfd8dc":"#ffe0b2";
      pxc(ctx,cx-sw*0.24,sh*0.58,sw*0.04,handC);pxc(ctx,cx+sw*0.24,sh*0.58,sw*0.04,handC);
      // Head
      pxc(ctx,cx,sh*0.22,sw*0.12*sz,era>=3?"#cfd8dc":"#ffe0b2");
      // Eyes
      const eyeC=era>=4?"#00e5ff":"#111";
      px(ctx,cx-sw*0.06,sh*0.2,2,2,"#fff");px(ctx,cx+sw*0.02,sh*0.2,2,2,"#fff");
      px(ctx,cx-sw*0.05,sh*0.21,1,1,eyeC);px(ctx,cx+sw*0.03,sh*0.21,1,1,eyeC);
      // Helmet by era
      if(era>=3){for(let hy=sh*0.1;hy<sh*0.18;hy++){const hw=sw*0.13;px(ctx,cx-hw,hy,hw*2,1,"#37474f");}
        px(ctx,cx-sw*0.14,sh*0.17,sw*0.28,2,"#263238");}

  });

/* ═══════ AI BRAIN ═══════ */
function createBrain(){
  const ab={flank:0,shareAmmo:0,rescue:0,swapWeapon:0,focusFire:0,retreat:0,shieldWall:0,surround:0,healAllies:0,
    rushTactics:0,deathSquad:0,siegeMode:0,berserkerRage:0,darkRitual:0,swarmIntel:0,titanShield:0,poisonCloud:0};
  return{gen:0,intel:0,coop:0,aggro:0.5,abilities:ab,disc:[],mem:{weak:[],deaths:0,ammoOut:0,hpHist:[]},
    evolve(g){this.gen++;
      const lr=this.gen<=1?0.4:this.gen<=10?(0.8+Math.log2(1+this.gen)*0.6):(1.5+this.gen*0.15);
      this.intel+=rn(1,3.5)*lr;this.coop+=rn(0.4,1.8)*lr*0.4;
      const m=this.mem;m.weak=[];
      for(let x=CX+30;x<W-60;x+=25){let th=0;for(const fl of g.floors)for(const h of fl)if(h&&h.hp>0)th+=Math.max(0,90-Math.abs(h.x-x));if(th<15)m.weak.push(x);}
      m.hpHist.push(g.hp/g.maxHp);if(m.hpHist.length>30)m.hpHist.shift();
      const trend=m.hpHist.length>1?m.hpHist[m.hpHist.length-2]-m.hpHist[m.hpHist.length-1]:0;
      this.aggro=cl(this.aggro+(trend>0?0.04:-0.02)*lr,0.15,3);
      const td=(k,b2,co)=>{if(this.abilities[k]>0){this.abilities[k]+=rn(0.5,2)*lr;return;}
        if(Math.random()<b2*(1+this.intel*0.008)*(co?3:0.3)){this.abilities[k]=1;this.disc.push({key:k,gen:this.gen});
          g.ft.push({x:W/2,y:GY-180,t:`🧠 AI lærte: ${k}!`,life:120,c:"#ff5252"});}};
      td("flank",0.04,m.weak.length>2);td("shareAmmo",0.03,m.ammoOut>3);td("rescue",0.02,m.deaths>5);
      td("swapWeapon",0.025,m.ammoOut>2);td("focusFire",0.03,true);td("retreat",0.02,m.deaths>10);
      td("shieldWall",0.012,true);td("surround",0.015,this.coop>15);td("healAllies",0.01,this.gen>5);
      if(g.wave>=15){td("rushTactics",0.04,true);td("berserkerRage",0.03,true);td("poisonCloud",0.02,true);}
      if(g.wave>=20){td("deathSquad",0.03,m.deaths>15);td("siegeMode",0.025,g.hp>g.maxHp*0.5);}
      if(g.wave>=30){td("darkRitual",0.03,true);td("swarmIntel",0.025,true);td("titanShield",0.02,true);}
      m.deaths=0;m.ammoOut=0;},
    can(k){return this.abilities[k]>0;},
    power(k){return this.abilities[k]||0;},
  };
}

/* ═══════ SPAWN ═══════ */
function spawnMon(wave,boss,brain,wD){
  const era=getEra(wave);
  // ALL races available, but current era is 70% likely, adjacent eras 25%, rest 5%
  const allRaces=Object.entries(RACES);
  const weighted=[];
  for(const[k,r] of allRaces){
    const w=r.era===era?10:Math.abs(r.era-era)===1?4:1;
    for(let i=0;i<w;i++)weighted.push([k,r]);
  }
  // Force healer: every 5th spawn is a healer
  const forceHealer=wD&&wD.sp>0&&wD.sp%5===0;
  let[rk,race]=pk(weighted);
  if(forceHealer){const healers=allRaces.filter(([,r])=>r.t==="healer");if(healers.length)[rk,race]=pk(healers);}
  if(boss){const big=allRaces.filter(([,r])=>r.t==="tank"||r.t==="boss"||r.t==="elite"||r.t==="siege");if(big.length)[rk,race]=pk(big);}
  let hpM,dmgM,spdM;
  if(wave<=2){hpM=1+wave*0.15;dmgM=0.7;spdM=0.6;}
  else if(wave<=5){hpM=1+wave*0.25;dmgM=0.8+wave*0.1;spdM=0.75+wave*0.02;}
  else if(wave<=10){hpM=2+wave*0.4;dmgM=1+wave*0.15;spdM=0.9+wave*0.015;}// HARD after 5
  else if(wave<=20){hpM=4+(wave-10)*0.6;dmgM=2.5+(wave-10)*0.2;spdM=1.05+wave*0.01;}
  else{const ow=wave-20;hpM=10+ow*1.2+ow*ow*0.06;dmgM=4.5+ow*0.4;spdM=1.2+ow*0.02;}
  if(wD&&wD.elite){hpM*=1.8;dmgM*=1.5;}
  if(wD&&wD.horde){hpM*=0.5;spdM*=1.3;}
  if(wD&&wD.nightmare){hpM*=2;dmgM*=1.7;spdM*=1.15;}
  hpM+=brain.intel*0.006;
  const isElite=!boss&&brain.can("deathSquad")&&Math.random()<0.15;
  if(isElite){hpM*=3;dmgM*=2;spdM*=0.8;}
  const arm=Math.min(~~(wave*0.8+era*4+(wave>20?(wave-20)*1.5:0)),80),bm=boss?3+wave*0.2:1,sc=boss?1.5:isElite?1.2:1;
  const wk=pk(race.wpns);const wd=WPNS[wk];
  const wpn={...wd,key:wk,cur:wd.am,d:Math.max(1,~~(wd.d*dmgM)),hl:wd.hl?~~(wd.hl*dmgM):0};
  let wpn2=null;
  if(brain.can("swapWeapon")&&Math.random()<0.3){const w2k=pk(race.wpns.filter(w=>w!==wk));if(w2k){const w2=WPNS[w2k];wpn2={...w2,key:w2k,cur:w2.am,d:Math.max(1,~~(w2.d*dmgM))};};}
  const shield=boss&&brain.can("titanShield")?~~(race.hp*hpM*bm*0.4):0;
  return{x:W+rn(5,60),y:GY+rn(-12,12),hp:~~(race.hp*hpM*bm),mhp:~~(race.hp*hpM*bm),
    bSpd:race.spd*spdM*(boss?0.6:1),rew:~~(race.r*(1+wave*0.03)*sc),w:race.w*sc,h:race.h*sc,
    raceId:rk,col:race.c,era:race.era,rType:race.t,wpn,wpn2,useW2:false,
    sl:0,stn:0,arm,dot:0,id:Math.random(),f:~~rn(0,100),boss,isElite,shield,maxShield:shield,
    role:"attack",morale:1,carrying:null,carried:false,retreating:false,retreated:false,
    isFlying:race.t==="fly",aCd:~~rn(0,20),atCastle:false};
}

/* ═══════ MONSTER AI ═══════ */
function monsterTick(en,g){
  if(en.stn>0){en.stn--;return;}if(en.carried)return;
  const brain=g.brain,spd=en.sl>0?en.bSpd*0.22:en.bSpd;
  const wpn=en.useW2&&en.wpn2?en.wpn2:en.wpn;
  en.f++;en.sl=Math.max(0,en.sl-1);if(en.dot>0){en.hp-=1;en.dot--;}
  // Find targets
  let nearH=null,nearD=9999,nearM=null,nearMD=9999;
  for(const fl of g.floors)for(const h of fl)if(h&&h.hp>0){const d=D(en.x,en.y,h.x,h.y);if(d<nearD){nearD=d;nearH=h;}}
  for(const m of g.melees)if(m&&m.hp>0){const d=D(en.x,en.y,m.x,m.y);if(d<nearMD){nearMD=d;nearM=m;}}
  const closestH=nearMD<nearD?nearM:nearH;const closestD=Math.min(nearD,nearMD);
  // ═══ HEALER AI: stay behind, heal wounded allies ═══
  if(en.rType==="healer"&&wpn&&wpn.hl>0){en.aCd--;if(en.aCd<=0){let tgt=null,lp=0.9;
    for(const e2 of g.enemies){if(e2===en||e2.carried||e2.hp<=0)continue;const p=e2.hp/e2.mhp;if(p<lp&&D(en.x,en.y,e2.x,e2.y)<(wpn.r||120)){lp=p;tgt=e2;}}
    if(tgt){en.aCd=wpn.rt;tgt.hp=Math.min(tgt.mhp,tgt.hp+wpn.hl);
      g.parts.push({x:tgt.x,y:tgt.y-tgt.h/2,vx:0,vy:-1,life:15,c:"#66bb6a",r:3});
      g.ft.push({x:tgt.x,y:tgt.y-tgt.h-8,t:`+${wpn.hl}`,life:18,c:"#66bb6a"});}}
    // Healers stay behind other monsters
    const frontAlly=g.enemies.find(e=>e!==en&&!e.carried&&e.hp>0&&e.x<en.x-20);
    if(frontAlly){en.x-=spd*0.3;}else{en.x-=spd*0.6;}
    en.y=cl(en.y,GY-22,GY+14);if(en.x<CX+60){en.atCastle=true;en.x=CX+60;}return;}
  // Swap weapon if empty
  if(brain.can("swapWeapon")&&en.wpn2&&wpn&&wpn.cur<=0&&!en.useW2)en.useW2=true;
  // Retreat if almost dead
  if(brain.can("retreat")&&en.hp<en.mhp*0.15&&!en.retreated){en.retreating=true;}
  if(en.retreating){en.x+=spd*0.5;en.hp=Math.min(en.mhp,en.hp+0.4);
    if(en.hp>en.mhp*0.5||en.x>=W-20){en.retreating=false;en.retreated=true;}return;}
  // At castle = smash it
  if(en.atCastle){en.aCd--;if(en.aCd<=0){const dm=wpn?Math.max(2,~~(wpn.d*0.5)):3;g.hp-=dm;en.aCd=wpn?~~(wpn.rt*0.8):35;
    for(let p=0;p<4;p++)g.parts.push({x:CX+rn(5,35),y:GY-rn(10,50),vx:rn(-3,3),vy:rn(-3,0),life:16,c:"#ff1744",r:3});
    g.ft.push({x:CX+rn(10,40),y:GY-rn(30,70),t:`-${dm}`,life:25,c:"#ff1744"});}en.x=CX+35+Math.sin(en.f*0.15)*4;return;}
  // ═══ RANGED AI: pistol/rifle monsters HOLD POSITION and shoot from distance ═══
  const isRanged=!wpn?.m&&wpn?.sp&&wpn.r>100&&(en.rType==="ranged"||en.rType==="splash"||en.rType==="mage");
  const holdRange=isRanged?Math.max(wpn.r*0.7,120):0;
  let mx=-spd,my=0;
  if(isRanged&&en.x-CX<holdRange+80&&closestH){
    // STOP and hold position — don't rush castle
    mx=0;
    // Sidestep to avoid melee heroes
    if(nearM&&nearMD<60){my+=(en.y>nearM.y?1:-1)*spd*0.8;mx=spd*0.4;}// dodge away
    // Back up if too close
    if(closestD<holdRange*0.5)mx=spd*0.5;
  }
  // ═══ TANK AI: rush forward to protect ranged allies ═══
  if(en.rType==="tank"||en.rType==="siege"){
    const rangedBehind=g.enemies.some(e=>e!==en&&!e.carried&&(e.rType==="ranged"||e.rType==="splash")&&e.x>en.x);
    if(rangedBehind)mx=-spd*1.2;// tanks rush faster to be frontline
  }
  // ═══ FAST AI: dodge and weave ═══
  if(en.rType==="fast"||en.rType==="swarm"){
    my+=Math.sin(en.f*0.12)*spd*0.5;// zigzag pattern
    if(nearM&&nearMD<50)my+=(en.y>nearM.y?1:-1)*spd;// dodge melee heroes
  }
  // ═══ ELITE AI: focus weakest hero ═══
  if(en.rType==="elite"&&closestH){
    let weakH=null,weakHP=Infinity;
    for(const fl of g.floors)for(const h of fl)if(h&&h.hp>0&&h.hp<weakHP){weakHP=h.hp;weakH=h;}
    for(const m of g.melees)if(m&&m.hp>0&&m.hp<weakHP){weakHP=m.hp;weakH=m;}
    if(weakH){const a=Math.atan2(weakH.y-en.y,weakH.x-en.x);mx+=Math.cos(a)*spd*0.2;my+=Math.sin(a)*spd*0.2;}
  }
  // ═══ FLY AI: fly high, dive to attack ═══
  if(en.isFlying){en.y=GY-30+Math.sin(en.f*0.04)*15;
    if(isRanged&&closestD<wpn.r)mx=0;// hovering gunship
  }
  // ═══ COOPERATION: nearby allies buff each other ═══
  if(en.f%60===0){
    const allies=g.enemies.filter(e=>e!==en&&!e.carried&&e.hp>0&&D(en.x,en.y,e.x,e.y)<80);
    // Group morale: more allies = braver
    en.morale=cl(0.8+allies.length*0.06,0.5,1.5);
    // Tanks near ranged = ranged shoot faster
    if(isRanged&&allies.some(a=>a.rType==="tank"||a.rType==="siege"))en.aCd=Math.max(0,en.aCd-3);
    // Share target info: if an ally is attacking, others focus same area
    if(brain.can("focusFire")&&allies.length>0){
      const attacking=allies.find(a=>a.atCastle);
      if(attacking&&!en.atCastle)mx=-spd*1.1;// rush to help
    }
  }
  // ═══ BRAIN ABILITIES ═══
  if(brain.can("surround")&&nearM&&nearMD<140){const a=Math.atan2(en.y-nearM.y,en.x-nearM.x)+0.05;mx+=Math.cos(a)*spd*0.3;my+=Math.sin(a)*spd*0.3;}
  if(brain.can("berserkerRage")&&en.hp<en.mhp*0.3){mx*=(isRanged?1:1.8);en.aCd=Math.max(0,en.aCd-1);
    if(en.f%120===0)g.parts.push({x:en.x,y:en.y-en.h,vx:0,vy:-2,life:15,c:"#ff1744",r:4});}
  if(brain.can("poisonCloud")&&en.f%90===0){for(const m of g.melees)if(m&&m.hp>0&&Math.hypot(m.x-en.x,m.y-en.y)<60)m.hp-=~~(1+brain.power("poisonCloud")*0.3);}
  if(brain.can("siegeMode")&&!isRanged&&Math.random()<0.3)mx=-spd*1.2;
  if(brain.can("swarmIntel")){const nearby=g.enemies.filter(e=>e!==en&&Math.hypot(e.x-en.x,e.y-en.y)<40).length;
    if(nearby>2)my+=(en.y>GY?-1:1)*spd*0.4;}
  if(brain.can("rushTactics")&&en.f<30)mx*=1.5;
  if(brain.can("flank")&&brain.mem.weak.length>0&&!isRanged){
    const wx=brain.mem.weak[~~(Math.random()*brain.mem.weak.length)];
    my+=(wx>en.y?1:-1)*spd*0.2;// move toward weak spot
  }
  // Shield visual
  if(en.shield>0&&en.f%60===0)g.parts.push({x:en.x+rn(-8,8),y:en.y-en.h/2,vx:0,vy:-1,life:20,c:"#42a5f5",r:3});
  // Apply movement
  if(!en.isFlying)en.y=cl(en.y+my,GY-22,GY+14);
  en.x+=mx*en.morale;if(en.x<CX+35){en.atCastle=true;en.x=CX+35+rn(0,15);en.aCd=0;return;}
  // ═══ SHOOTING ═══
  if(!wpn||wpn.cur<=0)return;en.aCd--;if(en.aCd>0)return;
  // Melee attack
  const meleeTarget=nearM&&nearMD<(wpn.r||30)+en.w/2+10?nearM:nearH&&nearD<(wpn.r||30)+en.w/2+10?nearH:null;
  if(wpn.m&&meleeTarget){const md=D(en.x,en.y,meleeTarget.x,meleeTarget.y);
    if(md<(wpn.r||30)+en.w/2+10){en.aCd=wpn.rt;meleeTarget.hp-=Math.max(1,wpn.d);wpn.cur--;
      g.parts.push({x:meleeTarget.x,y:meleeTarget.y-10,vx:rn(-2,2),vy:-2,life:12,c:"#ff1744",r:3});}
  // Ranged attack — shoot heroes AND melee defenders
  }else if(!wpn.m&&closestH&&closestD<wpn.r){en.aCd=wpn.rt;wpn.cur--;
    const tx=closestH.x,ty=closestH.y-12;
    // Mage casting particles
    if(en.rType==="mage"){for(let p=0;p<4;p++)g.parts.push({x:en.x+rn(-6,6),y:en.y-en.h/2+rn(-6,6),vx:rn(-2,2),vy:rn(-3,-1),life:15,c:en.col,r:rn(2,4)});}
    if(wpn.sp){const a=Math.atan2(ty-(en.y-en.h/2),tx-en.x);
      g.eProj.push({x:en.x,y:en.y-en.h/2,vx:Math.cos(a)*(wpn.sp||4),vy:Math.sin(a)*(wpn.sp||4),dmg:wpn.d,c:en.rType==="mage"?en.col:en.col,life:90,r:wpn.spl?5:en.rType==="mage"?4:3,spl:wpn.spl,sl:wpn.sl,dot:wpn.dot,stn:wpn.stn});}}
}

/* ═══════ HERO AI ═══════ */
function heroTick(h,g){
  if(h.hp<=0)return;let tar=null,minD=9999;
  for(const en of g.enemies){if(en.carried)continue;const d=D(h.x,h.y,en.x,en.y);if(d<minD){minD=d;tar=en;}}
  const home=h.homeX||CX+60;
  if(tar&&minD<380){const dx=tar.x-h.x,dy=tar.y-h.y,di=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    if(di>h.range){h.x+=(dx/di)*h.spd;h.y+=(dy/di)*h.spd*0.3;}
    h.y=cl(h.y,GY-25,GY+10);h.facing=dx>0?1:-1;
    if(minD<h.range+(tar.w||20)/2+10){h.cd=Math.max(0,h.cd-1);if(h.cd<=0){
      let dmg=h.damage;const forge=g.bSlots.find(b=>b&&b.id==="forge");if(forge)dmg=~~(dmg*BLDGS.forge.ef(forge.lvl).mul);
      const actual=Math.max(1,dmg-(tar.arm||0));tar.hp-=actual;h.cd=h.fireRate;
      g.ft.push({x:tar.x,y:tar.y-tar.h-8,t:`-${actual}`,life:22,c:"#ef5350"});
      if(h.heals)g.hp=Math.min(g.hp+h.heals,g.maxHp);

  }else{if(Math.abs(h.x-home)>5)h.x+=(home-h.x)*0.04;h.y+=(GY-h.y)*0.05;h.facing=1;}
}

      <div style={{flex:1,position:"relative",minWidth:0}}>
        <canvas ref={cvs} width={W} height={H} style={{borderRadius:S.br,border:S.bd,width:"100%",height:"auto",display:"block"}}/>
        <button onClick={()=>{spdRef.current=spdRef.current>=4?1:spdRef.current*2;setUi(u=>({...u,spd:spdRef.current}));}} style={{position:"absolute",bottom:8,left:8,background:"rgba(0,0,0,0.7)",border:"1px solid #ffd54f",borderRadius:8,padding:"4px 10px",color:"#ffd54f",fontWeight:900,fontSize:16,cursor:"pointer",fontFamily:FN}}>⚡ {ui.spd||1}x</button>
        {!ui.wA&&ui.wave===0&&<div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",color:"rgba(255,255,255,0.3)",fontSize:16,fontWeight:700,fontFamily:FN}}>Trykk SPACE for å starte</div>}
      </div>
      {/* RIGHT: shop panel */}
      {/* RIGHT PANEL */}
      {ui.showTree&&ui.classPick?(()=>{const cls=ui.classPick;const cd=CLASSES[cls];const tree=getClassTree(cls);const sk=ui.classSkills||[];const sp=ui.classSkillPts||0;
        const TW=280,TH=280,tcx=TW/2,tcy=TH/2;
        const nPos=(node)=>{const ang=(node.col/6)*Math.PI*2-Math.PI/2;const rad=18+node.row*16.5;
          return{x:tcx+Math.cos(ang)*rad,y:tcy+Math.sin(ang)*rad};};
        return(<div style={{width:295,flexShrink:0,background:"#06060e",border:`2px solid ${cd.c}25`,borderRadius:8,padding:4,display:"flex",flexDirection:"column",gap:2,overflowY:"auto",maxHeight:H}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{fontSize:16,fontWeight:900,color:cd.c}}>{cd.n}</div>
            <button onClick={()=>setUi(u=>({...u,showTree:false}))} style={{background:"transparent",border:"1px solid #222",borderRadius:4,color:"#555",cursor:"pointer",fontFamily:FN,fontSize:16,padding:"4px 8px"}}>✕</button></div>
          <div style={{fontSize:16,color:sp>0?"#ffd54f":"#444",fontWeight:700,textAlign:"center"}}>🌟 {sp} poeng · {sk.length}/48 ulåst</div>
          <div style={{position:"relative",width:TW,height:TH,margin:"0 auto"}}>
            <svg width={TW} height={TH} style={{position:"absolute",top:0,left:0,pointerEvents:"none"}}>
              {/* Faint ring guides */}
              {[0,1,2,3,4,5,6,7].map(r=>(<circle key={r} cx={tcx} cy={tcy} r={18+r*16.5} fill="none" stroke="#0d0d18" strokeWidth={0.5}/>))}
              {/* Branch lines from center to first ring */}
              {[0,1,2,3,4,5].map(col=>{const ang=(col/6)*Math.PI*2-Math.PI/2;
                return(<line key={`br${col}`} x1={tcx} y1={tcy} x2={tcx+Math.cos(ang)*18} y2={tcy+Math.sin(ang)*18} stroke={`${cd.c}20`} strokeWidth={0.5}/>);})}
              {/* Connection lines between nodes */}
              {tree.map(node=>{const p=nPos(node);return node.req.map(rid=>{const pn=tree.find(n=>n.id===rid);if(!pn)return null;const pp=nPos(pn);
                const both=sk.includes(node.id)&&sk.includes(rid);const has1=sk.includes(rid);
                return(<line key={`${node.id}-${rid}`} x1={pp.x} y1={pp.y} x2={p.x} y2={p.y}
                  stroke={both?cd.c:has1?"#334":"#111"} strokeWidth={both?2:0.8}
                  opacity={both?0.9:has1?0.5:0.2}/>);});})}
              {/* Center star */}
              <circle cx={tcx} cy={tcy} r={10} fill={`${cd.c}20`} stroke={cd.c} strokeWidth={1.5}/>
              <circle cx={tcx} cy={tcy} r={4} fill={cd.c} opacity={0.6}/>
              {/* Decorative stars */}
              {[...Array(30)].map((_,i)=>(<circle key={`st${i}`} cx={(i*43+11)%TW} cy={(i*29+7)%TH} r={0.4+(i%3)*0.2} fill="#fff" opacity={0.08+i%5*0.03}/>))}
            </svg>
            {/* Nodes as glowing dots */}
            {tree.map(node=>{const p=nPos(node);const unlocked=sk.includes(node.id);const canBuy=sp>0&&!unlocked&&node.req.every(r=>sk.includes(r));const locked=!unlocked&&!canBuy;
              const sz=unlocked?16:canBuy?14:9;
              return(<button key={node.id} onClick={()=>{if(canBuy)spendSkill(node.id);}} title={`${node.n}\n${node.d}`}
                style={{position:"absolute",left:p.x-sz/2,top:p.y-sz/2,width:sz,height:sz,padding:0,
                  border:unlocked?`2px solid ${cd.c}`:canBuy?"2px solid #4caf50":"1px solid #1a1a2a",
                  borderRadius:"50%",
                  background:unlocked?`radial-gradient(circle,${cd.c}80,${cd.c}15)`:canBuy?"radial-gradient(circle,#4caf5050,#4caf5010)":"radial-gradient(circle,#12121a,#08080e)",
                  cursor:canBuy?"pointer":"default",fontSize:0,color:"transparent",
                  opacity:locked?0.2:1,
                  boxShadow:unlocked?`0 0 8px ${cd.c}50,0 0 3px ${cd.c}`:canBuy?"0 0 6px #4caf5030":"none",zIndex:2}}>
              </button>);})}
            {/* Center class icon */}
            <div style={{position:"absolute",left:tcx-8,top:tcy-5,fontSize:15,pointerEvents:"none",textAlign:"center",fontWeight:900,color:cd.c,textShadow:`0 0 8px ${cd.c}`}}>
              {cd.n.split(" ")[0]}</div>
          </div>
          <div style={{display:"flex",gap:2,justifyContent:"center",flexWrap:"wrap"}}>
            {["Basis","Styrke","Kraft","Mester","Elite","Legend","Titan","Gud"].map((l,i)=>{const cnt=tree.filter(n=>n.row===i&&sk.includes(n.id)).length;
              return(<span key={i} style={{fontSize:16,padding:"1px 3px",borderRadius:3,background:cnt>0?`${cd.c}15`:"transparent",color:cnt>0?cd.c:"#222",fontWeight:cnt>0?700:400,border:`1px solid ${cnt>0?cd.c+"30":"#111"}`}}>{l} {cnt}/6</span>);})}
          </div>
          <div style={{fontSize:16,color:"#333",textAlign:"center"}}>Hold over noder for detaljer · Boss = +1🌟 · {cd.heroes.length} helter</div>
        </div>);})()
      :shopTarget?(()=>{const{fi,si,isM}=shopTarget;const arr=isM?ui.melees:ui.floors[fi];const hero=arr?arr[si]:null;const hl=isM?mH:rH;
        const DIA_C=[3,5,8];
        if(hero){const hd=HEROES[hero.type],uc=~~((30+hero.level*24)*hd.um);const inWave=ui.wA;
          return(<div style={{width:210,flexShrink:0,background:S.bg,border:S.bd,borderRadius:S.br,padding:5,display:"flex",flexDirection:"column",gap:2,overflowY:"auto",maxHeight:H}}>
            <div style={{display:"flex",alignItems:"center",gap:3}}>
              <div style={{width:24,height:24,borderRadius:6,background:`${hd.c}20`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <div style={{width:10,height:10,borderRadius:"50%",background:hd.c,boxShadow:`0 0 8px ${hd.c}`}}/></div>
              <div><div style={{fontSize:15,fontWeight:700,color:hd.c}}>{hd.n} Lv{hero.level}{hero.hasS?" ⭐":""}</div>
                <div style={{fontSize:16,color:"#6e7681"}}>{hd.desc}{hero.diaLvl>0?` · 💎${hero.diaLvl}/3`:""} · {hd.cls}</div></div></div>
            <div style={{background:"rgba(255,255,255,0.03)",borderRadius:4,padding:5,fontSize:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:2}}>
              <div>⚔ Dmg: <b style={{color:"#ef5350"}}>{hero.damage}</b></div>
              <div>🎯 Rekk: <b style={{color:"#4fc3f7"}}>{hero.range}</b></div>
              {isM&&<div>❤ HP: <b style={{color:"#66bb6a"}}>{hero.hp}/{hero.maxHp}</b></div>}
              {isM&&<div>💨 Spd: <b style={{color:"#ffa726"}}>{(hero.spd||0).toFixed(1)}</b></div>}
              <div>⏱ Rate: <b style={{color:"#b388ff"}}>{hero.fireRate}</b></div>
              {(hero.crit||0)>0&&<div>💥 Crit: <b>{hero.crit}%</b></div>}
            </div>
            {hd.spec&&<div style={{background:"rgba(124,77,255,0.08)",borderRadius:4,padding:3}}>
              <div style={{fontSize:16,fontWeight:700,color:"#b388ff"}}>⚡ {hd.spec.n}</div>
              <div style={{fontSize:16,color:"#8b949e"}}>{hd.spec.desc} · {~~(hd.spec.cd/60)}s cd</div>
              <div style={{width:"100%",marginTop:2,padding:5,borderRadius:4,textAlign:"center",background:hero.specCd>0?"#21262d":"linear-gradient(135deg,#7c4dff,#b388ff)",color:"#fff",fontWeight:700,fontSize:12,fontFamily:FN}}>{hero.specCd>0?`⏱ ${~~(hero.specCd/60)}s`:"✅ AUTO-KLAR!"}</div></div>}
            {!inWave&&<Btn onClick={()=>upgH(fi,si,isM)} disabled={ui.money<uc}>⬆ Oppgrader ({uc}💰)</Btn>}
            {inWave&&<div style={{fontSize:15,color:"#6e7681",textAlign:"center"}}>🔒 Kun i pause</div>}
            {hero.diaLvl<3&&hd.dia&&!inWave&&(()=>{const dc=DIA_C[hero.diaLvl];return(<div>
              <div style={{fontSize:15,color:"#b388ff",fontWeight:700}}>💎 Nivå {hero.diaLvl+1}/3 ({dc}💎):</div>
              {hd.dia.map((d,di)=>(<Btn key={di} onClick={()=>diaUpgrade(fi,si,isM,di)} disabled={ui.dia<dc} bg="linear-gradient(135deg,#7c4dff,#b388ff)" style={{fontSize:12}}>{d}</Btn>))}</div>);})()}
            {!inWave&&<Btn onClick={()=>{sellH(fi,si,isM);setUi(u=>({...u,shop:null,showTree:false}));}} bg="#c62828" style={{fontSize:13}}>Selg ({~~(hd.cost*0.5)}💰)</Btn>}
          </div>);}
        const placed=new Set();if(gR.current){for(const fl of gR.current.floors)for(const h of fl)if(h)placed.add(h.type);for(const m of gR.current.melees)if(m)placed.add(m.type);}
        const allH=Object.entries(HEROES).filter(([k,h])=>isM?(h.t==="m"):(h.t==="r"));
        const avail=allH.filter(([k])=>!placed.has(k));
        const tabs=[{id:"alle",n:"Alle",c:"#8b949e"},...Object.entries(CLASSES).map(([id,cl])=>({id,n:cl.n.split(" ")[0]+" "+cl.n.split(" ")[1],c:cl.c}))];
        const filtered=ui.shopTab==="alle"?avail:avail.filter(([k,h])=>h.cls===ui.shopTab);
        const sortedFiltered=[...filtered].sort((a,b)=>a[1].cost-b[1].cost);
        return(<div style={{width:240,flexShrink:0,background:S.bg,border:S.bd,borderRadius:S.br,padding:4,display:"flex",flexDirection:"column",gap:2,overflowY:"auto",maxHeight:H}}>
          <div style={{fontSize:15,fontWeight:700,color:"#e6edf3",textAlign:"center"}}>{isM?"⚔ BUTIKK — Krigere":"🏹 BUTIKK — Helter"}</div>
          {/* Class tabs */}
          <div style={{display:"flex",gap:1,flexWrap:"wrap",justifyContent:"center"}}>
            {tabs.filter(t=>t.id==="alle"||(isM?["angrep","tank"].includes(t.id):true)).map(t=>{
              const active=ui.shopTab===t.id;const cnt=t.id==="alle"?avail.length:avail.filter(([k,h])=>h.cls===t.id).length;
              return(<button key={t.id} onClick={()=>setUi(u=>({...u,shopTab:t.id}))}
                style={{padding:"4px 8px",border:`1px solid ${active?t.c:t.c+"30"}`,borderRadius:4,
                  background:active?`${t.c}20`:"transparent",color:active?t.c:"#555",
                  fontFamily:FN,fontSize:16,fontWeight:active?700:400,cursor:"pointer"}}>
                {t.id==="alle"?"📋":t.n.split(" ")[0]} {t.id==="alle"?"Alle":t.n.split(" ")[1]} <span style={{color:"#444",fontSize:12}}>({cnt})</span>
              </button>);})}
          </div>
          {/* Class info banner */}
          {ui.shopTab!=="alle"&&CLASSES[ui.shopTab]&&(<div style={{background:`${CLASSES[ui.shopTab].c}08`,border:`1px solid ${CLASSES[ui.shopTab].c}20`,borderRadius:4,padding:5,textAlign:"center"}}>
            <div style={{fontSize:15,fontWeight:700,color:CLASSES[ui.shopTab].c}}>{CLASSES[ui.shopTab].n}</div>
            <div style={{fontSize:16,color:"#555"}}>{CLASSES[ui.shopTab].d}</div>
            {ui.classPick===ui.shopTab&&<div style={{fontSize:16,color:"#ffd54f"}}>⭐ Din valgte klasse! Skill-tre bonus aktiv</div>}
          </div>)}
          <div style={{fontSize:16,color:"#333"}}>{sortedFiltered.length} tilgjengelig · kun 1 av hver · sortert etter pris</div>
          {/* Hero list */}
          <div style={{display:"flex",flexDirection:"column",gap:1}}>
            {sortedFiltered.map(([k,h])=>{const hd=HEROES[k];const ok=ui.money>=h.cost;const clsD=CLASSES[hd.cls];
              const isChosenCls=ui.classPick===hd.cls;
              return(<button key={k} onClick={()=>{if(ok){placeH(fi,si,k,isM);setUi(u=>({...u,shop:null,showTree:false}));}}} disabled={!ok}
                style={{display:"flex",alignItems:"center",gap:3,padding:5,
                  border:isChosenCls?`1px solid ${clsD?.c||"#333"}30`:S.bd,borderRadius:5,
                  cursor:ok?"pointer":"default",color:ok?"#e6edf3":"#30363d",fontFamily:FN,fontSize:16,
                  opacity:ok?1:0.3,background:isChosenCls?`${clsD?.c||"#333"}06`:"transparent"}}>
                <div style={{width:28,height:28,borderRadius:4,background:`${h.c}15`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,position:"relative"}}>
                  <div style={{width:12,height:12,borderRadius:"50%",background:h.c,boxShadow:`0 0 5px ${h.c}`}}/>
                  {isChosenCls&&<div style={{position:"absolute",top:-2,right:-2,fontSize:11}}>⭐</div>}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:2}}>
                    <span style={{fontWeight:700}}>{h.n}</span>
                    <span style={{fontSize:15,padding:"0px 3px",borderRadius:3,background:`${clsD?.c||"#666"}15`,color:clsD?.c||"#666",border:`1px solid ${clsD?.c||"#666"}25`}}>{hd.cls}</span>
                  </div>
                  <div style={{fontSize:16,color:"#6e7681"}}>{h.desc}</div>
                  <div style={{fontSize:16,color:"#8b949e",display:"flex",gap:3}}>
                    <span>⚔{hd.dmg}</span>{hd.hp?<span>❤{hd.hp}</span>:null}{hd.rng?<span>🎯{hd.rng}</span>:null}
                    {hd.spl?<span>💥spl</span>:null}{hd.chain?<span>⚡ch{hd.chain}</span>:null}
                    {hd.healAmt?<span>💖h{hd.healAmt}</span>:null}{hd.slow?<span>🐌sl</span>:null}
                  </div>
                  {hd.spec&&<div style={{fontSize:15,color:"#b388ff"}}>⚡{hd.spec.n}: {hd.spec.desc}</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",flexShrink:0}}>
                  <span style={{color:ok?"#ffa726":"#ef5350",fontWeight:700,fontSize:11}}>{h.cost}</span>
                  <span style={{fontSize:15,color:"#555"}}>💰</span>
                </div>
              </button>);})}
          </div>
          {sortedFiltered.length===0&&<div style={{fontSize:16,color:"#6e7681",textAlign:"center",padding:8}}>
            {avail.length===0?"Alle plassert!":"Ingen i denne kategorien"}</div>}
        </div>);
      })()
      // CLASS PICKER (if no class chosen yet)
      :!ui.classPick&&ui.wave>=2?(<div style={{width:210,flexShrink:0,background:S.bg,border:"2px solid #ffd54f40",borderRadius:S.br,padding:6,display:"flex",flexDirection:"column",gap:3}}>
        <div style={{fontSize:16,fontWeight:900,color:"#ffd54f",textAlign:"center"}}>🌳 VELG KLASSE</div>
        <div style={{fontSize:15,color:"#8b949e",textAlign:"center"}}>Velg 1 klasse — alle helter av den typen styrkes av skill-treet!</div>
        {Object.entries(CLASSES).map(([k,cls])=>(<button key={k} onClick={()=>pickClass(k)} style={{display:"flex",alignItems:"center",gap:4,padding:5,border:`1px solid ${cls.c}40`,borderRadius:6,
          background:`${cls.c}08`,cursor:"pointer",fontFamily:FN,color:"#e6edf3",fontSize:13}}>
          <div style={{fontSize:14}}>{cls.n.split(" ")[0]}</div>
          <div style={{flex:1}}><div style={{fontWeight:700,color:cls.c}}>{cls.n.split(" ")[1]}</div>
            <div style={{fontSize:16,color:"#8b949e"}}>{cls.d}</div>
            <div style={{fontSize:16,color:"#555"}}>{cls.heroes.length} helter</div></div>
        </button>))}
      </div>)
      // SKILL TREE BUTTON (when class chosen, no shop open)
      :ui.classPick&&!shopTarget?(<div style={{width:160,flexShrink:0,background:S.bg,border:S.bd,borderRadius:S.br,padding:5,display:"flex",flexDirection:"column",gap:3}}>
        <button onClick={()=>setUi(u=>({...u,showTree:true}))} style={{padding:6,border:`2px solid ${CLASSES[ui.classPick].c}40`,borderRadius:6,
          background:`${CLASSES[ui.classPick].c}08`,cursor:"pointer",fontFamily:FN,color:CLASSES[ui.classPick].c,fontWeight:700,fontSize:12}}>
          🌳 Skill Tre<br/><span style={{fontSize:15,color:"#8b949e"}}>{(ui.classSkills||[]).length}/48 · {ui.classSkillPts||0} poeng</span></button>
        <div style={{fontSize:15,color:"#6e7681",textAlign:"center"}}>{CLASSES[ui.classPick].n}</div>
        <div style={{fontSize:16,color:"#444",textAlign:"center"}}>Trykk på en slot for å kjøpe/se helter</div>
      </div>):null}
    </div>);
}


try {
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(BiffauerX));
} catch(e) {
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').textContent = 'Error: ' + e.message + '\n' + e.stack;
}
</script>
