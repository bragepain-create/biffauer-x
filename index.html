  // --- Kjør robot-program (facing-basert, støtter loop/if) ---
  function runProgram(blocks, startFacing){
    var x=0,y=0,path=[[0,0]];
    var dirs=['N','E','S','W'];
    var facing=startFacing||q.startFacing||'N';
    var dm={N:[0,1],E:[1,0],S:[0,-1],W:[-1,0]};
    function turnR(d){return dirs[(dirs.indexOf(d)+1)%4];}
    function turnL(d){return dirs[(dirs.indexOf(d)+3)%4];}
    function execBlocks(blist){
      for(var i=0;i<blist.length;i++){
        var b=blist[i];
        if(b.type==='forward'){
          var dv=dm[facing]; x+=dv[0]; y+=dv[1]; path.push([x,y]);
        } else if(b.type==='turnR'){
          facing=turnR(facing);
        } else if(b.type==='turnL'){
          facing=turnL(facing);
        } else if(b.type==='loop'&&b.inner){
          var n=b.n||2;
          for(var li=0;li<n;li++) execBlocks(b.inner);
        } else if(b.type==='if'){
          var cond=b.cond||'x>0';
          var val=cond.includes('x')?x:y;
          var op=cond.includes('>')?'>':'<';
          var pass=op==='>'?val>0:val<0;
          if(pass&&b.inner) execBlocks(b.inner);
          else if(!pass&&b.elseInner) execBlocks(b.elseInner);
        }
        if(path.length>200)break; // sikkerhetsbegrensning
      }
    }
    execBlocks(blocks);
    return {ex:x,ey:y,path:path};
  }

    // Animasjon: vis ett steg om gangen
    setAnimStep(0);
    setRunPath(fullPath);
    var delay=Math.max(180, Math.min(420, 2000/fullPath.length));
    function stepAnim(i){
      if(i>=fullPath.length-1){
        // Ferdig animert
        setTimeout(function(){
          setResult(ok?'correct':'wrong');
          setTimeout(function(){ok?onCorrect():onWrong(res.answer);},1400);
        }, 500);
        return;
      }
      setTimeout(function(){
        setAnimStep(i+1);
        stepAnim(i+1);
      }, delay);
    }
    stepAnim(0);
  }

    if(q.isScratch){submitScratch();return;}
    if(result!==null||!input||input==='-'||input===',')return;

    if(needsDecimal){ok=!isNaN(num)&&Math.abs(num-q.answer)<0.011;}

// ÷ Naturlig språk → helt-stats. Parser norsk beskrivelse og fyller inn felter.
//   Brukes både i HeroEditor og MonsterEditor for å la admin "snakke" en figur
//   til live i stedet for å skyve på alle gliderne manuelt.
function parseHeroDescription(text, baseDef) {
  const t = (text || "").toLowerCase();
  const out = {...baseDef};
  if (!t.trim()) return out;

  // ─── KLASSE ───
  if (/\bbue|skytter\b.*pil|piler/.test(t) || /\bbue\b/.test(t)) out.cls = "bue";
  else if (/magi|trolldom|sjaman|magiker/.test(t)) out.cls = "magi";
  else if (/pistol|gevær|haglgevær|maskingevær|skyt(t?er|skytter)/.test(t)) out.cls = "pistol";
  else if (/stjerne|guddommelig|legend|gud\b|himmel/.test(t)) out.cls = "stjerne";

  // ─── PRIS-NIVÅ (50/100/750) ───
  if (/legend|gud|mektig|episk|sjelden|kraftigste|strongest|tigers/.test(t)) out.cost = 750;
  else if (/middels|standard|vanlig|moderate/.test(t)) out.cost = 100;
  else if (/billig|enkel|basic|svak/.test(t) && !out.cost) out.cost = 50;

  // ─── SKADE ───
  if (/voldsom|ekstrem|massiv|brutal|dødelig/.test(t)) out.dmg = 60;
  else if (/sterk|kraftig|stor.skade|hardtreffende/.test(t)) out.dmg = 30;
  else if (/svak|liten.skade|harmløs/.test(t)) out.dmg = 5;

  // ─── SKUDDRATE (lavere fr = raskere) ───
  if (/galaktisk|maskingevær|maskinrask|sprøytefyrer/.test(t)) out.fr = 6;
  else if (/rask|hurtig|raske.skudd|kjapp/.test(t)) out.fr = 18;
  else if (/treg|langsom|sjelden(t)?\s+skud|sniper|presisjon/.test(t)) out.fr = 80;

  // ─── REKKEVIDDE ───
  if (/lang.*rekk|fra.langt|sniper|presisjon|kikkert/.test(t)) out.rng = 400;
  else if (/kort.*rekk|nær.*kamp|nærkamp|haglgevær/.test(t)) out.rng = 150;

  // ─── CRIT ───
  if (/crit|kritisk|presis|treffsikker|skarp|hodeskudd/.test(t)) out.crit = 30;
  if (/heldig.skudd|garantert.crit/.test(t)) out.crit = 40;

  // ─── SPLASH ───
  if (/splash|eksplos|område|aoe|treffer.mange|salve|massiv.skade.til.flere/.test(t)) out.spl = 35;
  if (/gigantisk.eksplos|mega.bombe/.test(t)) out.spl = 70;

  // ─── SLOW ───
  if (/frys|kald|is\b|frost|brems|saktere|isenes|snøstorm/.test(t)) out.slow = 80;
  if (/permafrost|fryser.alle|tidsstopp/.test(t)) out.slow = 150;

  // ─── CHAIN (lyn-hopp) ───
  if (/lyn|torden|elektrisk|chain|kjede|hopp.*fiender|tesla/.test(t)) out.chain = 3;
  if (/lyn.til.alle|tordenstorm/.test(t)) out.chain = 5;

  // ─── DOT (skade over tid) ───
  if (/gift|brenn|flamme\b|ild\b|over.tid|forgift|pest|røyk/.test(t)) out.dotH = 8;
  if (/dødelig.gift|lava|inferno/.test(t)) out.dotH = 12;

  // ─── DRAIN ───
  if (/mørk|skygge|sjel|sug|drain|dra.hp|liv.fra/.test(t)) out.drain = 1;
  if (/avgrunn|sjelefangst/.test(t)) out.drain = 2;

  // ─── FARGE ut fra element ───
  if (/ild\b|brann|flamme/.test(t)) out.color = "#ef5350";
  else if (/vann|is\b|frost/.test(t)) out.color = "#42a5f5";
  else if (/gift|grønn/.test(t)) out.color = "#66bb6a";
  else if (/lyn|gull|gylden|gul\b/.test(t)) out.color = "#ffd54f";
  else if (/mørk|skygge|sort|svart/.test(t)) out.color = "#311b92";
  else if (/lys|hellig|hvit/.test(t)) out.color = "#fff9c4";
  else if (/lilla|magisk|magi/.test(t)) out.color = "#ab47bc";

  // ─── CUSTOM-LOGIKK fra nøkkelord — bygges som klosser ───
  // Velger fra ferdige blokker for å garantere fungerende kode.
  const blocks = [];

  // Fargefiltrerte triggere (mest spesifikke først)
  if (/blå.*(monster|fiende)|når.*blå|blå.*kommer|frost-fiende|is-fiende/.test(t)) {
    if (/frys|kald|is\b/.test(t) || /stopp|sak/.test(t)) {
      blocks.push({trigger: "blue_enemy_near", triggerParams: {distance: 250}, action: "freeze_all", actionParams: {radius: 200, duration: 120}});
    } else if (/skad|drep|angrip|skyt/.test(t)) {
      blocks.push({trigger: "blue_enemy_near", triggerParams: {distance: 250}, action: "damage_all", actionParams: {radius: 200, amount: 30}});
    } else if (/teleport|tilbake/.test(t)) {
      blocks.push({trigger: "blue_enemy_near", triggerParams: {distance: 250}, action: "teleport_nearest", actionParams: {distance: 250}});
    } else {
      blocks.push({trigger: "blue_enemy_near", triggerParams: {distance: 250}, action: "freeze_all", actionParams: {radius: 200, duration: 120}});
    }
  } else if (/rød.*(monster|fiende)|når.*rød|rød.*kommer|ild-fiende/.test(t)) {
    if (/frys|kald|is\b/.test(t)) {
      blocks.push({trigger: "red_enemy_near", triggerParams: {distance: 250}, action: "freeze_all", actionParams: {radius: 200, duration: 120}});
    } else {
      blocks.push({trigger: "red_enemy_near", triggerParams: {distance: 250}, action: "damage_all", actionParams: {radius: 200, amount: 35}});
    }
  } else if (/grønn.*(monster|fiende)|grønn.*kommer/.test(t)) {
    blocks.push({trigger: "green_enemy_near", triggerParams: {distance: 250}, action: "damage_all", actionParams: {radius: 200, amount: 30}});
  } else if (/boss|elite/.test(t)) {
    blocks.push({trigger: "boss_near", triggerParams: {distance: 300}, action: "damage_nearest", actionParams: {amount: 50}});
  } else if (/flyv|fly\b/.test(t)) {
    blocks.push({trigger: "flying_near", triggerParams: {distance: 250}, action: "damage_nearest", actionParams: {amount: 30}});
  }

  // Generelle handlinger (uten farge-trigger)
  if (!blocks.length) {
    // ─── SKYTE-BALLER (prioritet over andre handlinger) ───
    if (/skyt|sender.*ball|kaster.*ball|skyter.*ball|skyter.*kule/.test(t)) {
      let ballAction = "shoot_red_ball";
      if (/blå|frost|is\b|frys/.test(t)) ballAction = "shoot_blue_ball";
      else if (/grønn|gift/.test(t)) ballAction = "shoot_green_ball";
      else if (/gul|gull|rask|hurtig/.test(t)) ballAction = "shoot_yellow_ball";
      else if (/lilla|magisk|magi|eksplos/.test(t)) ballAction = "shoot_purple_ball";
      else if (/ild|brenn|flamme|rød.*ild|fire/.test(t)) ballAction = "shoot_fire_ball";
      else if (/tre.ball|3.*ball|mange.*ball|flere.*ball/.test(t)) ballAction = "shoot_three_balls";
      blocks.push({trigger: "enemy_near", triggerParams: {distance: 280}, action: ballAction, actionParams: {}});
    } else if (/teleport|sender.tilbake|tilbake.til.start/.test(t)) {
      blocks.push({trigger: "enemy_near", triggerParams: {distance: 200}, action: "teleport_nearest", actionParams: {distance: 200}});
    } else if (/dytt|push.bak|skyv.tilbake/.test(t)) {
      blocks.push({trigger: "enemy_near", triggerParams: {distance: 150}, action: "push_all", actionParams: {radius: 150, distance: 50}});
    } else if (/heal.allierte|heler.andre|legevitenskap|heler.helter|helbreder/.test(t)) {
      blocks.push({trigger: "ally_low_health", triggerParams: {percent: 60, radius: 200}, action: "heal_lowest_ally", actionParams: {amount: 10, radius: 200}});
    } else if (/eksplos.*puls|periodi.*bombe|sjokkbølge|aoe.*hver/.test(t)) {
      blocks.push({trigger: "many_enemies", triggerParams: {count: 3}, action: "damage_all", actionParams: {radius: 150, amount: 25}});
    } else if (/frys.område|fryser.alle.rundt|isfelt|kuldebølge/.test(t)) {
      blocks.push({trigger: "always", triggerParams: {}, action: "freeze_all", actionParams: {radius: 200, duration: 60}});
    } else if (/forgift.område|gifter.alle/.test(t)) {
      blocks.push({trigger: "enemy_near", triggerParams: {distance: 200}, action: "poison_all", actionParams: {radius: 180, duration: 120}});
    } else if (/sjelesug|drar.hp|suger.liv|vampir/.test(t)) {
      blocks.push({trigger: "enemy_near", triggerParams: {distance: 200}, action: "lifesteal", actionParams: {amount: 10}});
    } else if (/fryser.nærmeste|stopper.fiende/.test(t)) {
      blocks.push({trigger: "enemy_near", triggerParams: {distance: 250}, action: "freeze_nearest", actionParams: {duration: 90}});
    } else if (/lav.hp.*hel|når.lav.hp|skadd.hel.deg/.test(t)) {
      blocks.push({trigger: "low_health", triggerParams: {percent: 40}, action: "heal_self", actionParams: {amount: 15}});
    }
  }

  if (blocks.length) {
    out.blocks = blocks;
    out.customLogic = compileBlocksToLogic(blocks);
  }

  return out;
}

// ÷ EKTE AI: Prøver å bruke Anthropic-API for å generere stats fra beskrivelsen.

//   gir det ekstremt bedre resultater. Hvis ikke (downloadet fil), faller tilbake

async function generateFromDescription(description, baseDef) {
  const fallback = () => ({ source: "ord-kjenner", ...parseHeroDescription(description, baseDef) });

  // Prøv ekte AI-API
  try {
    const prompt = `Du designer en helt for "BIFFAUER X" — et norsk tårnforsvar-spill.

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }]
      })
    });

    if (!response.ok) throw new Error("API status " + response.status);
    const data = await response.json();

    // Hent ut tekst fra alle text-blocks
    const text = (data.content || [])
      .filter(c => c.type === "text")
      .map(c => c.text)
      .join("\n");

    // Rens markdown-formatering hvis modellen la til den
    const cleaned = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(cleaned);
    // ÷ Kompiler blocks-array til customLogic-streng
    if (parsed.blocks && parsed.blocks.length) {
      parsed.customLogic = compileBlocksToLogic(parsed.blocks);
    }
    return { source: "ekte AI 🤖", ...baseDef, ...parsed };
  } catch (err) {
    console.log("AI fallback til ord-kjenner:", err.message);
    return fallback();
  }
}

function HeroEditor(props) {
  // props: pixels, sprite, suggestedDef, onClose, onSave
  const FN = "monospace";
  const def = props.suggestedDef;
  // ÷ Sprite/piksler holdes i state så AI kan oppdatere figuren
  const [currentSprite, setCurrentSprite] = React.useState(props.sprite);
  const [currentPixels, setCurrentPixels] = React.useState(props.pixels);
  const [name, setName] = React.useState(def.name);
  const [cls, setCls] = React.useState(def.cls);
  const [cost, setCost] = React.useState(def.cost);
  const [dmg, setDmg] = React.useState(def.dmg);
  const [rng, setRng] = React.useState(def.rng);
  const [fr, setFr] = React.useState(def.fr);
  const [crit, setCrit] = React.useState(def.crit);
  const [spl, setSpl] = React.useState(def.spl || 0);
  const [slow, setSlow] = React.useState(def.slow || 0);
  const [chain, setChain] = React.useState(def.chain || 0);
  const [dotH, setDotH] = React.useState(def.dotH || 0);
  const [drain, setDrain] = React.useState(def.drain || 0);
  const [limited, setLimited] = React.useState(false);
  const [description, setDescription] = React.useState("");
  const [color, setColor] = React.useState(def.color);
  const [aiLoading, setAiLoading] = React.useState(false);
  const [aiSource, setAiSource] = React.useState(null);
  const [customLogic, setCustomLogic] = React.useState("");
  const [blocks, setBlocks] = React.useState([]);  // ÷ Scratch-lignende klosser

  // ÷ Bruk beskrivelsen til å fylle inn alle stats automatisk (prøver ekte AI først)
  async function applyDescription() {
    if (!description.trim()) {
      alert("Skriv en beskrivelse først!\nF.eks. 'En rød ball som teleporterer fiender'");
      return;
    }
    setAiLoading(true);
    setAiSource(null);
    const baseDef = {
      cls, cost, dmg, rng, fr, crit, spl, slow,
      chain, dotH, drain, color, name
    };
    try {
      const result = await generateFromDescription(description, baseDef);
      if (result.cls) setCls(result.cls);
      if (result.cost !== undefined) setCost(result.cost);
      if (result.dmg !== undefined) setDmg(result.dmg);
      if (result.rng !== undefined) setRng(result.rng);
      if (result.fr !== undefined) setFr(result.fr);
      if (result.crit !== undefined) setCrit(result.crit);
      if (result.spl !== undefined) setSpl(result.spl);
      if (result.slow !== undefined) setSlow(result.slow);
      if (result.chain !== undefined) setChain(result.chain);
      if (result.dotH !== undefined) setDotH(result.dotH);
      if (result.drain !== undefined) setDrain(result.drain);
      if (result.color) setColor(result.color);
      if (result.name) setName(result.name);
      if (result.blocks) setBlocks(result.blocks);
      if (result.customLogic !== undefined) setCustomLogic(result.customLogic || "");
      // ÷ Auto-tegn figuren basert på beskrivelsen!
      const newPixels = generateDrawingFromText(description);
      const newSprite = pixelsToCanvas(newPixels);
      setCurrentPixels(newPixels);
      setCurrentSprite(newSprite);
      setAiSource(result.source || "ord-kjenner");
    } catch (e) {
      alert("Feil under generering: " + e.message);
    } finally {
      setAiLoading(false);
    }
  }

  function row(label, val, setVal, min, max, step) {
    return React.createElement('div', { style: { display:"flex", alignItems:"center", gap:8, marginBottom:6 } },
      React.createElement('span', { style: { width:90, fontSize:11, color:"#888" } }, label),
      React.createElement('input', {
        type: "range", min, max, step: step || 1,
        value: val,
        onChange: e => setVal(parseFloat(e.target.value)),

// ÷ Gi admin katte-tårn + katte-bakgrunn (kjøres ved login OG ved session-restore)
function grantAdminCatSkins() {
  if (!window.BX_IS_ADMIN) return;
  try {
    var owned = BX_OWNED_GET();
    var changed = false;
    ["tarn:katte_tarn", "bg:katte_bg", "fort:katte_fort"].forEach(function(id){ if (owned.indexOf(id) === -1) { owned.push(id); changed = true; } });
    if (changed) BX_OWNED_SET(owned);
    var u = (window.BX_USER||"").toLowerCase();
    if (!localStorage.getItem("bx_castle_skin_"+u)) localStorage.setItem("bx_castle_skin_"+u, "katte_tarn");
    if (!localStorage.getItem("bx_bg_skin_"+u)) { localStorage.setItem("bx_bg_skin_"+u, "katte_bg"); window.BX_BG_SKIN = "katte_bg"; }
    if (!localStorage.getItem("bx_fort_skin_"+u)) { localStorage.setItem("bx_fort_skin_"+u, "katte_fort"); window.BX_FORT_SKIN = "katte_fort"; }
  } catch(e){}
}

function AppRoot() {
  const [user, setUser] = React.useState(window.BX_USER);
  const [viewingUser, setViewingUser] = React.useState(null);
  const [showMulti, setShowMulti] = React.useState(false);

  // Ved oppstart / session-restore: hvis admin allerede er innlogget, gi katte-skins
  React.useEffect(() => { grantAdminCatSkins(); }, [user]);

  const logout = () => {
    // Stop music
    if (window.BX_MUSIC && window.BX_MUSIC.isPlaying()) window.BX_MUSIC.stop();
    // Disconnect multiplayer if active
    if (window.BX_MULTI && window.BX_MULTI.isConnected()) window.BX_MULTI.disconnect();
    // Clear user from global state
    window.BX_USER = null;
    window.BX_IS_ADMIN = false;
    window.BX_IS_MINI_ADMIN = false;
    window.BX_PERMS = {};
    window.BX_GUEST = false;
    if (window.BX_AUTH) window.BX_AUTH.clearSession();   // glem sesjon → neste gang MÅ man logge inn
    // Reset React state
    setUser(null);
    setShowMulti(false);
    setViewingUser(null);
  };

  if (!user) {
    return React.createElement(LoginScreen, {onLogin: name => {
    window.BX_USER = name;
    // Re-bind storage so it uses new user prefix
    if (window.BX_STORAGE) window.storage = window.BX_STORAGE;
    // Gjest = IKKE husk (ingen sesjon) → forsvinner ved reload, akkurat som "prøv uten å lagre"
    if (window.BX_AUTH && !window.BX_GUEST) window.BX_AUTH.saveSession();
    setUser(name);
    if (window.BX_MUSIC) window.BX_MUSIC.start();
    // ÷ Vis admin-melding + gi admin katte-tårn og katte-bakgrunn
    if (window.BX_IS_ADMIN) {
      setTimeout(function(){ console.log("👑 ADMIN MODE — Bragepain"); }, 100);
      grantAdminCatSkins();
    }
  }});
  }
  if (showMulti) {
    return React.createElement(MultiScreen, {onBack: () => setShowMulti(false)});
  }
  return React.createElement(BiffauerX, {currentUser: user, viewingUser, setViewingUser, onLogout: logout, onMulti: () => setShowMulti(true)});
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AppRoot));
</script>
<script>
// ═══════ VOID SPIRAL CURSOR (kun PC) — 10 stjerne-skins ═══════
// CURSOR_SKINS er global så React-velgeren kan vise dem.
window.CURSOR_SKINS = [
  { name:'Void',    emoji:'🌌', star:'#e0aaff', glow:'#c77dff', core:'#ff6b9d', damp:['#c77dff','#ff6b9d','#00dcff'], hz:[520,900] },
  { name:'Ild',     emoji:'🔥', star:'#ffcc80', glow:'#ff7043', core:'#ffeb3b', damp:['#ff7043','#ffa726','#ffeb3b'], hz:[300,700] },
  { name:'Is',      emoji:'❄️', star:'#b3e5fc', glow:'#4fc3f7', core:'#ffffff', damp:['#4fc3f7','#80d8ff','#e1f5fe'], hz:[760,1400] },
  { name:'Gift',    emoji:'☠️', star:'#ccff90', glow:'#76ff03', core:'#eeff41', damp:['#76ff03','#b2ff59','#eeff41'], hz:[400,850] },
  { name:'Gull',    emoji:'👑', star:'#ffe082', glow:'#ffc107', core:'#fff59d', damp:['#ffc107','#ffd54f','#fff176'], hz:[600,1050] },
  { name:'Blod',    emoji:'🩸', star:'#ff8a80', glow:'#f44336', core:'#ff1744', damp:['#f44336','#ff5252','#ff8a80'], hz:[220,540] },
  { name:'Hav',     emoji:'🌊', star:'#80deea', glow:'#00bcd4', core:'#84ffff', damp:['#00bcd4','#26c6da','#80deea'], hz:[500,950] },
  { name:'Regnbue', emoji:'🌈', star:'#f8bbd0', glow:'#e040fb', core:'#ffff00', damp:['#ff6b9d','#40c4ff','#b2ff59','#ffd54f'], hz:[520,1150] },
  { name:'Skygge',  emoji:'🌑', star:'#bdbdbd', glow:'#616161', core:'#ffffff', damp:['#616161','#9e9e9e','#bdbdbd'], hz:[170,420] },
  { name:'Stjerne', emoji:'⭐', star:'#fff9c4', glow:'#fff176', core:'#ffffff', damp:['#fff176','#ffffff','#e1f5fe'], hz:[680,1360] }
];
(function(){
  // Kun på PC med mus — hopp over på touch/mobil (iPad/telefon bruker berøring)
  try { if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return; } catch(e){}
  var SKINS = window.CURSOR_SKINS;
  var skinIdx = 0;
  try { var sv = parseInt(localStorage.getItem('bx_cursor_skin'),10); if (!isNaN(sv) && sv>=0 && sv<SKINS.length) skinIdx = sv; } catch(e){}
  var SK = SKINS[skinIdx];
  var TC = SK.damp;
  var style = document.createElement('style');
  style.textContent =
    'html.vsc-on, html.vsc-on * { cursor: none !important; }' +
    '#vsc-star { position:fixed; pointer-events:none; z-index:100002; }' +
    '#vsc-star.spin { animation: vsc-spin .5s cubic-bezier(.2,.8,.3,1.2); }' +
    '@keyframes vsc-spin { 0% { transform: rotate(0deg) scale(.55); } 60% { transform: rotate(320deg) scale(1.18); } 100% { transform: rotate(360deg) scale(1); } }' +
    '.vsc-p { position:fixed; pointer-events:none; z-index:99999; border-radius:50%; will-change:transform,opacity; }';
  document.head.appendChild(style);
  function starSVG(sk){
    return '<svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M13 3 L15.2 10.8 L23 13 L15.2 15.2 L13 23 L10.8 15.2 L3 13 L10.8 10.8 Z" fill="'+sk.star+'" stroke="'+sk.glow+'" stroke-width="1"/>' +
      '<circle cx="13" cy="13" r="1.6" fill="'+sk.core+'"/></svg>';
  }
  var star = document.createElement('div'); star.id = 'vsc-star';
  function paintStar(){ star.innerHTML = starSVG(SK); star.style.filter = 'drop-shadow(0 0 6px '+SK.glow+')'; }
  paintStar();
  // Global bytter — kalles fra React-velgeren
  window.BX_setCursorSkin = function(i){
    if (i<0 || i>=SKINS.length) return;
    skinIdx = i; SK = SKINS[i]; TC = SK.damp;
    try { localStorage.setItem('bx_cursor_skin', String(i)); } catch(e){}
    paintStar();
  };
  window.BX_getCursorSkin = function(){ return skinIdx; };
  var mx = -100, my = -100;
  // DAMP (røyk) — myke uklare gnister i skinnets farger som stiger og fader
  function spawnDamp(x, y){
    var p = document.createElement('div'); p.className = 'vsc-p';
    var s = 11 + Math.random()*15, c = TC[(Math.random()*TC.length)|0];
    p.style.cssText = 'left:'+(x-s/2)+'px;top:'+(y-s/2)+'px;width:'+s+'px;height:'+s+'px;background:radial-gradient(circle,'+c+'99,transparent 72%);filter:blur(3px);opacity:.7;transition:opacity 1.1s ease, transform 1.1s ease;';
    document.body.appendChild(p);
    var dx = (Math.random()-.5)*26;
    requestAnimationFrame(function(){ p.style.opacity='0'; p.style.transform='translate('+dx+'px,-30px) scale(3.4)'; });
    setTimeout(function(){ p.remove(); }, 1120);
  }
  // SPIRAL ved klikk — gnister spinner utover i skinnets farger
  function spiralBurst(x, y){
    var N = 26;
    for (var i=0;i<N;i++){ (function(i){
      setTimeout(function(){
        var p=document.createElement('div'); p.className='vsc-p';
        var c=TC[i%TC.length], s=3+Math.random()*2;
        p.style.cssText='left:'+(x-s/2)+'px;top:'+(y-s/2)+'px;width:'+s+'px;height:'+s+'px;background:'+c+';box-shadow:0 0 8px '+c+';opacity:1;transition:transform .7s cubic-bezier(.2,.7,.3,1), opacity .7s;';
        document.body.appendChild(p);
        var ang=i*0.62, rad=8+i*2.5;
        requestAnimationFrame(function(){ p.style.transform='translate('+Math.cos(ang)*rad+'px,'+Math.sin(ang)*rad+'px) scale(.15)'; p.style.opacity='0'; });
        setTimeout(function(){ p.remove(); }, 720);
      }, i*9);
    })(i); }
  }
  var _actx = null;
  function clickSound(){
    try {
      if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
      var ctx = _actx, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(SK.hz[0], ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(SK.hz[1], ctx.currentTime + 0.06);
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.2);
    } catch(e){}
  }
  function mount(){
    if (!document.body) { requestAnimationFrame(mount); return; }
    document.body.appendChild(star);
    document.documentElement.classList.add('vsc-on');
    document.addEventListener('mousemove', function(e){
      mx = e.clientX; my = e.clientY;
      star.style.left = (mx-13)+'px'; star.style.top = (my-13)+'px';
      if (document.querySelectorAll('.vsc-p').length < 90) { spawnDamp(mx, my); spawnDamp(mx, my); if (Math.random() < 0.6) spawnDamp(mx, my); }
    });
    document.addEventListener('mousedown', function(){ star.classList.remove('spin'); void star.offsetWidth; star.classList.add('spin'); spiralBurst(mx, my); clickSound(); });
    document.addEventListener('mouseleave', function(){ star.style.display='none'; });
    document.addEventListener('mouseenter', function(){ star.style.display=''; });
    // Jevn damp HELE TIDEN — også når musa står stille (stjernen ryker alltid, MYE damp)
    setInterval(function(){ if (mx >= 0 && my >= 0 && document.querySelectorAll('.vsc-p').length < 90) { spawnDamp(mx, my); spawnDamp(mx, my); } }, 100);
  }
  mount();
})();
</script>
