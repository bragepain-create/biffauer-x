        const mw = sw * 0.48 * Math.sin((my - sh * 0.2) / (sh * 0.5) * Math.PI);
        px(ctx, cx - mw, my, mw * 2, 1, "#311b92");
        if (my % 3 === 0) px(ctx, cx - mw, my, mw * 2, 1, "#4527a0");
      }
      // Dome
      pxc(ctx, cx, sh * 0.3, sw * 0.2, "#4527a0");
      pxc(ctx, cx, sh * 0.28, sw * 0.12, "rgba(179,136,255,0.3)");
      // Lights
      for (let i = 0; i < 10; i++) {
        const lx = cx - sw * 0.4 + i * sw * 0.08;
        pxc(ctx, lx, sh * 0.5, 2, i % 2 ? "#00e5ff" : "#e040fb");
      }
      // Bottom beam
      ctx.fillStyle = "rgba(179,136,255,0.08)";
      ctx.beginPath();
      ctx.moveTo(cx - sw * 0.1, sh * 0.65);
      ctx.lineTo(cx - sw * 0.2, sh * 0.95);
      ctx.lineTo(cx + sw * 0.2, sh * 0.95);
      ctx.lineTo(cx + sw * 0.1, sh * 0.65);
      ctx.fill();
    } else if (raceId === "titan") {
      // GIANT humanoid robot
      // Legs
      px(ctx, cx - sw * 0.18, sh * 0.7, sw * 0.12, sh * 0.25, "#283593");
      px(ctx, cx + sw * 0.06, sh * 0.7, sw * 0.12, sh * 0.25, "#283593");
      px(ctx, cx - sw * 0.2, sh * 0.5, sw * 0.14, sh * 0.22, "#1a237e");
      px(ctx, cx + sw * 0.06, sh * 0.5, sw * 0.14, sh * 0.22, "#1a237e");
      // Feet
      px(ctx, cx - sw * 0.22, sh * 0.93, sw * 0.18, sh * 0.05, "#283593");
      px(ctx, cx + sw * 0.04, sh * 0.93, sw * 0.18, sh * 0.05, "#283593");
      // Torso
      ctx.fillStyle = "#1a237e";
      ctx.beginPath();
      ctx.moveTo(cx - sw * 0.28, sh * 0.5);
      ctx.lineTo(cx - sw * 0.2, sh * 0.2);
      ctx.lineTo(cx + sw * 0.2, sh * 0.2);
      ctx.lineTo(cx + sw * 0.28, sh * 0.5);
      ctx.fill();
      pxc(ctx, cx, sh * 0.38, sw * 0.08, "rgba(255,213,79,0.3)");
      pxc(ctx, cx, sh * 0.38, 4, "rgba(255,213,79,0.6)"); // core
      // Arms
      px(ctx, cx - sw * 0.38, sh * 0.22, sw * 0.1, sh * 0.35, "#283593");
      px(ctx, cx + sw * 0.28, sh * 0.22, sw * 0.1, sh * 0.35, "#283593");
      // Weapon hands glow
      pxc(ctx, cx - sw * 0.33, sh * 0.58, sw * 0.06, "rgba(255,213,79,0.4)");
      pxc(ctx, cx + sw * 0.33, sh * 0.58, sw * 0.06, "rgba(0,229,255,0.4)");
      // Head
      px(ctx, cx - sw * 0.1, sh * 0.1, sw * 0.2, sh * 0.12, "#1a237e");
      px(ctx, cx - sw * 0.04, sh * 0.12, 3, 3, "#ff1744");
      px(ctx, cx + sw * 0.02, sh * 0.12, 3, 3, "#ff1744"); // red eyes
      // Shoulder pads
      pxc(ctx, cx - sw * 0.3, sh * 0.22, sw * 0.08, "#303f9f");
      pxc(ctx, cx + sw * 0.3, sh * 0.22, sw * 0.08, "#303f9f");
    } else if (race.t === "mage") {
      // MAGE: robed figure with glowing hands and magic aura
      // Robe (wide triangular body)
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.moveTo(cx - sw * 0.05, sh * 0.25);
      ctx.lineTo(cx - sw * 0.28, sh * 0.95);
      ctx.lineTo(cx + sw * 0.28, sh * 0.95);
      ctx.lineTo(cx + sw * 0.05, sh * 0.25);
      ctx.fill();
      // Robe detail stripe
      px(ctx, cx - sw * 0.02, sh * 0.3, sw * 0.04, sh * 0.6, lt(c, 20));
      // Hood/head
      ctx.fillStyle = dk(c, 20);
      ctx.beginPath();
      ctx.arc(cx, sh * 0.22, sw * 0.15, 0, Math.PI * 2);
      ctx.fill();
      px(ctx, cx - sw * 0.12, sh * 0.15, sw * 0.24, sh * 0.1, dk(c, 30)); // hood shadow
      // Eyes (glowing)
      pxc(ctx, cx - sw * 0.05, sh * 0.22, 2, era >= 3 ? "#00e5ff" : "#ffeb3b");
      pxc(ctx, cx + sw * 0.05, sh * 0.22, 2, era >= 3 ? "#00e5ff" : "#ffeb3b");
      // Arms with glowing hands
      px(ctx, cx - sw * 0.3, sh * 0.35, sw * 0.08, sh * 0.25, dk(c, 10));
      px(ctx, cx + sw * 0.22, sh * 0.35, sw * 0.08, sh * 0.25, dk(c, 10));
      // Glowing orbs in hands
      const gc = era >= 4 ? "#7c4dff" : era >= 3 ? "#ce93d8" : era >= 2 ? "#ffd54f" : era >= 1 ? "#4fc3f7" : "#ff6f00";
      pxc(ctx, cx - sw * 0.3, sh * 0.62, sw * 0.06, gc);
      pxc(ctx, cx + sw * 0.26, sh * 0.62, sw * 0.06, gc);
      // Magic aura glow
      ctx.fillStyle = `${gc}33`;
      ctx.beginPath();
      ctx.arc(cx, sh * 0.5, sw * 0.35, 0, Math.PI * 2);
      ctx.fill();
      // Staff
      px(ctx, cx + sw * 0.15, sh * 0.2, 2, sh * 0.75, "#5d4037");
      pxc(ctx, cx + sw * 0.16, sh * 0.18, sw * 0.05, gc); // staff gem
    } else {
      // Generic humanoid (warriors, gunners, soldiers, etc)
      const sz = race.t === "elite" ? 1.1 : race.t === "healer" ? 0.85 : 1;
      // Boots
      px(ctx, cx - sw * 0.15, sh * 0.9, sw * 0.12, sh * 0.08, era >= 3 ? "#212121" : "#3e2723");
      px(ctx, cx + sw * 0.03, sh * 0.9, sw * 0.12, sh * 0.08, era >= 3 ? "#212121" : "#3e2723");
      // Legs
      const lc = era >= 3 ? "#263238" : era >= 2 ? "#455a64" : "#5d4037";
      px(ctx, cx - sw * 0.12, sh * 0.65, sw * 0.09, sh * 0.27, lc);
      px(ctx, cx + sw * 0.03, sh * 0.65, sw * 0.09, sh * 0.27, lc);
      // Belt
      px(ctx, cx - sw * 0.2, sh * 0.62, sw * 0.4, sh * 0.04, era >= 3 ? "#37474f" : "#5d4037");
      px(ctx, cx - sw * 0.02, sh * 0.61, sw * 0.04, sh * 0.05, era >= 3 ? "#78909c" : "#ffd54f"); // buckle
      // Torso
      const bc = race.t === "healer" ? era >= 3 ? "#f06292" : era >= 2 ? "#e91e63" : "#66bb6a" : c;
      for (let ty = sh * 0.3; ty < sh * 0.64; ty++) {
        const tw = sw * 0.22 * sz * Math.sin((ty - sh * 0.3) / (sh * 0.34) * Math.PI);
        px(ctx, cx - tw, ty, tw * 2, 1, bc);
        px(ctx, cx - tw, ty, 1, 1, lt(bc, 15));
      }
      // Arms
      px(ctx, cx - sw * 0.28, sh * 0.32, sw * 0.08, sh * 0.25, era >= 3 ? "#37474f" : bc);
      px(ctx, cx + sw * 0.2, sh * 0.32, sw * 0.08, sh * 0.25, era >= 3 ? "#37474f" : bc);
      // Hands
      const handC = era >= 3 ? "#cfd8dc" : "#ffe0b2";
      pxc(ctx, cx - sw * 0.24, sh * 0.58, sw * 0.04, handC);
      pxc(ctx, cx + sw * 0.24, sh * 0.58, sw * 0.04, handC);
      // Head
      pxc(ctx, cx, sh * 0.22, sw * 0.12 * sz, era >= 3 ? "#cfd8dc" : "#ffe0b2");
      // Eyes
      const eyeC = era >= 4 ? "#00e5ff" : "#111";
      px(ctx, cx - sw * 0.06, sh * 0.2, 2, 2, "#fff");
      px(ctx, cx + sw * 0.02, sh * 0.2, 2, 2, "#fff");
      px(ctx, cx - sw * 0.05, sh * 0.21, 1, 1, eyeC);
      px(ctx, cx + sw * 0.03, sh * 0.21, 1, 1, eyeC);
      // Helmet by era
      if (era >= 3) {
        for (let hy = sh * 0.1; hy < sh * 0.18; hy++) {
          const hw = sw * 0.13;
          px(ctx, cx - hw, hy, hw * 2, 1, "#37474f");
        }
        px(ctx, cx - sw * 0.14, sh * 0.17, sw * 0.28, 2, "#263238");
      } else if (era >= 2) {
        pxc(ctx, cx, sh * 0.14, sw * 0.12, "#455a64");
      } else if (era >= 1) {
        pxc(ctx, cx, sh * 0.14, sw * 0.1, "#6d4c41");
      }
      if (era >= 4) {
        pxc(ctx, cx, sh * 0.4, sw * 0.2, "rgba(124,77,255,0.12)");
      } // energy field
      // Weapon visual
      if (era >= 2) {
        px(ctx, cx + sw * 0.22, sh * 0.35, 2, sh * 0.2, "#546e7a");
      }
      // Healer cross
      if (race.t === "healer") {
        px(ctx, cx - 1, sh * 0.4, 3, 8, "#fff");
        px(ctx, cx - 2.5, sh * 0.44, 6, 2, "#fff");
      }
    }
    // Boss glow
    if (boss) {
      ctx.fillStyle = "rgba(255,213,79,0.06)";
      ctx.beginPath();
      ctx.arc(cx, sh * 0.5, sw * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

/* ═══════ AI BRAIN ═══════ */
function createBrain() {
  const ab = {
    flank: 0,
    shareAmmo: 0,
    rescue: 0,
    swapWeapon: 0,
    focusFire: 0,
    retreat: 0,
    shieldWall: 0,
    surround: 0,
    healAllies: 0,
    rushTactics: 0,
    deathSquad: 0,
    siegeMode: 0,
    berserkerRage: 0,
    darkRitual: 0,
    swarmIntel: 0,
    titanShield: 0,
    poisonCloud: 0
  };
  return {
    gen: 0,
    intel: 0,
    coop: 0,
    aggro: 0.5,
    abilities: ab,
    disc: [],
    mem: {
      weak: [],
      deaths: 0,
      ammoOut: 0,
      hpHist: []
    },
    evolve(g) {
      this.gen++;
      const lr = this.gen <= 1 ? 0.4 : this.gen <= 10 ? 0.8 + Math.log2(1 + this.gen) * 0.6 : 1.5 + this.gen * 0.15;
      this.intel += rn(1, 3.5) * lr;
      this.coop += rn(0.4, 1.8) * lr * 0.4;
      const m = this.mem;
      m.weak = [];
      for (let x = CX + 30; x < W - 60; x += 25) {
        let th = 0;
        for (const fl of g.floors) for (const h of fl) if (h && h.hp > 0) th += Math.max(0, 90 - Math.abs(h.x - x));
        if (th < 15) m.weak.push(x);
      }
      m.hpHist.push(g.hp / g.maxHp);
      if (m.hpHist.length > 30) m.hpHist.shift();
      const trend = m.hpHist.length > 1 ? m.hpHist[m.hpHist.length - 2] - m.hpHist[m.hpHist.length - 1] : 0;
      this.aggro = cl(this.aggro + (trend > 0 ? 0.04 : -0.02) * lr, 0.15, 3);
      const td = (k, b2, co) => {
        if (this.abilities[k] > 0) {
          this.abilities[k] += rn(0.5, 2) * lr;
          return;
        }
        if (Math.random() < b2 * (1 + this.intel * 0.008) * (co ? 3 : 0.3)) {
          this.abilities[k] = 1;
          this.disc.push({
            key: k,
            gen: this.gen
          });
          // (flytende "🧠 AI lærte: …"-melding fjernet — skal ikke vise at monstrene blir smartere)
        }
      };
      td("flank", 0.04, m.weak.length > 2);
      td("shareAmmo", 0.03, m.ammoOut > 3);
      td("rescue", 0.02, m.deaths > 5);
      td("swapWeapon", 0.025, m.ammoOut > 2);
      td("focusFire", 0.03, true);
      td("retreat", 0.02, m.deaths > 10);
      td("shieldWall", 0.012, true);
      td("surround", 0.015, this.coop > 15);
      td("healAllies", 0.01, this.gen > 5);
      if (g.wave >= 15) {
        td("rushTactics", 0.04, true);
        td("berserkerRage", 0.03, true);
        td("poisonCloud", 0.02, true);
      }
      if (g.wave >= 20) {
        td("deathSquad", 0.03, m.deaths > 15);
        td("siegeMode", 0.025, g.hp > g.maxHp * 0.5);
      }
      if (g.wave >= 30) {
        td("darkRitual", 0.03, true);
        td("swarmIntel", 0.025, true);
        td("titanShield", 0.02, true);
      }
      m.deaths = 0;
      m.ammoOut = 0;
    },
    can(k) {
      return this.abilities[k] > 0;
    },
    power(k) {
      return this.abilities[k] || 0;
    }
  };
}

/* ═══════ SPAWN ═══════ */
function spawnMon(wave, boss, brain, wD) {
  const era = getEra(wave);
  // ALL races available, but current era is 70% likely, adjacent eras 25%, rest 5%
  const allRaces = Object.entries(RACES);
  const weighted = [];
  for (const [k, r] of allRaces) {
    if (r.t === "healer") continue;   // ÷ Healer-monstre fjernet (helbredet de andre — gjorde det for vanskelig)
    const w = r.era === era ? 10 : Math.abs(r.era - era) === 1 ? 4 : 1;
    for (let i = 0; i < w; i++) weighted.push([k, r]);
  }
  let [rk, race] = pk(weighted);
  if (boss) {
    const big = allRaces.filter(([, r]) => r.t === "tank" || r.t === "boss" || r.t === "elite" || r.t === "siege");
    if (big.length) [rk, race] = pk(big);
  }
  let hpM, dmgM, spdM;
  if (wave <= 2) {
    hpM = 1 + wave * 0.12;
    dmgM = 0.7;
    spdM = 0.6;
  } else if (wave <= 5) {
    hpM = 1.2 + wave * 0.18;
    dmgM = 0.8 + wave * 0.07;
    spdM = 0.75 + wave * 0.02;
  } else if (wave <= 10) {
    // JEVN fra bølge 5 (var 1.8+w*.28 = 3.48 på bølge 6, et brått hopp fra 2.1)
    hpM = 2.1 + (wave - 5) * 0.34;
    dmgM = 1.15 + (wave - 5) * 0.1;
    spdM = 0.9 + wave * 0.012;
  } else if (wave <= 20) {
    hpM = 3.5 + (wave - 10) * 0.45;
    dmgM = 2 + (wave - 10) * 0.15;
    spdM = 1.05 + wave * 0.008;
  } else {
    // Snillere sen-spill: lineær vekst (ingen kvadratisk eksplosjon)
    const ow = wave - 20;
    hpM = 8 + ow * 0.9;
    dmgM = 3.5 + ow * 0.3;
    spdM = 1.15 + ow * 0.012;
  }
  if (wD && wD.elite) {
    hpM *= 1.5;
    dmgM *= 1.3;
  }
  if (wD && wD.horde) {
    hpM *= 0.5;
    spdM *= 1.3;
  }
  if (wD && wD.nightmare) {
    hpM *= 2;
    dmgM *= 1.7;
    spdM *= 1.15;
  }
  hpM += brain.intel * 0.006;
  const isElite = !boss && brain.can("deathSquad") && Math.random() < 0.15;
  if (isElite) {
    hpM *= 3;
    dmgM *= 2;
    spdM *= 0.8;
  }
  // ÷ KORT: Lynkort gjør monstrene sterkere (enemyMul)
  if (wD && wD.enemyMul && wD.enemyMul > 1) {
    hpM *= wD.enemyMul;
    dmgM *= wD.enemyMul;
  }
  // ÷ VANSKELIGHETSGRAD: Lett/Normal/Vanskelig skalerer styrke (én knapp for hele kurven)
  if (wD && wD.diffMul) {
    hpM *= wD.diffMul;
    dmgM *= wD.diffMul;
  }
  // ÷ BALANSE (Brage): monstrene er SVAKERE — de gjør mindre skade (mindre dødelige),
  //   men beholder mer og mer HP over bølgene (utfordringen er å drepe dem, ikke å overleve).
  dmgM *= 0.5;
  hpM *= 1.15;
  const arm = Math.min(~~(wave * 0.8 + era * 4 + (wave > 20 ? (wave - 20) * 1.5 : 0)), 80),
    bm = boss ? 3 + wave * 0.2 : 1,
    sc = boss ? 1.5 : isElite ? 1.2 : 1;
  const wk = pk(race.wpns);
  const wd = WPNS[wk];
  const wpn = {
    ...wd,
    key: wk,
    cur: wd.am,
    d: Math.max(1, ~~(wd.d * dmgM)),
    hl: wd.hl ? ~~(wd.hl * dmgM) : 0
  };
  let wpn2 = null;
  if (brain.can("swapWeapon") && Math.random() < 0.3) {
    const w2k = pk(race.wpns.filter(w => w !== wk));
    if (w2k) {
      const w2 = WPNS[w2k];
      wpn2 = {
        ...w2,
        key: w2k,
        cur: w2.am,
        d: Math.max(1, ~~(w2.d * dmgM))
      };
    }
    ;
  }
  const shield = boss && brain.can("titanShield") ? ~~(race.hp * hpM * bm * 0.4) : 0;
  return {
    x: W + rn(5, 60),
    y: GY + rn(-12, 12),
    hp: ~~(race.hp * hpM * bm),
    mhp: ~~(race.hp * hpM * bm),
    bSpd: race.spd * spdM * (boss ? 0.6 : 1),
    rew: ~~(race.r * (1 + wave * 0.03) * sc * (wD && wD.moneyMul ? wD.moneyMul : 1)),
    w: race.w * sc,
    h: race.h * sc,
    raceId: rk,
    col: race.c,
    era: race.era,
    rType: race.t,
    wpn,
    wpn2,
    useW2: false,
    sl: 0,
    stn: 0,
    arm,
    dot: 0,
    id: Math.random(),
    f: ~~rn(0, 100),
    boss,
    isElite,
    shield,
    maxShield: shield,
    role: "attack",
    morale: 1,
    carrying: null,
    carried: false,
    retreating: false,
    retreated: false,
    isFlying: race.t === "fly",
    aCd: ~~rn(0, 20),
    atCastle: false
  };
}

/* ═══════ MONSTER AI ═══════ */
function monsterTick(en, g) {
  if (en.stn > 0) {
    en.stn--;
    return;
  }
  if (en.carried) return;
  const brain = g.brain,
    spd = en.sl > 0 ? en.bSpd * 0.22 : en.bSpd;
  const wpn = en.useW2 && en.wpn2 ? en.wpn2 : en.wpn;
  en.f++;
  en.sl = Math.max(0, en.sl - 1);
  if (en.dot > 0) {
    en.hp -= 1;
    en.dot--;
  }
  // Find targets
  let nearH = null,
    nearD = 9999,
    nearM = null,
    nearMD = 9999;
  for (const fl of g.floors) for (const h of fl) if (h && h.hp > 0) {
    const d = D(en.x, en.y, h.x, h.y);
    if (d < nearD) {
      nearD = d;
      nearH = h;
    }
  }
  for (const m of g.melees) if (m && m.hp > 0) {
    const d = D(en.x, en.y, m.x, m.y);
    if (d < nearMD) {
      nearMD = d;
      nearM = m;
    }
  }
  const closestH = nearMD < nearD ? nearM : nearH;
  const closestD = Math.min(nearD, nearMD);
  // ═══ HEALER AI: stay behind, heal wounded allies ═══
  if (en.rType === "healer" && wpn && wpn.hl > 0) {
    en.aCd--;
    if (en.aCd <= 0) {
      let tgt = null,
        lp = 0.9;
      for (const e2 of g.enemies) {
        if (e2 === en || e2.carried || e2.hp <= 0) continue;
        const p = e2.hp / e2.mhp;
        if (p < lp && D(en.x, en.y, e2.x, e2.y) < (wpn.r || 120)) {
          lp = p;
          tgt = e2;
        }
      }
      if (tgt) {
        en.aCd = wpn.rt;
        tgt.hp = Math.min(tgt.mhp, tgt.hp + wpn.hl);
        g.parts.push({
          x: tgt.x,
          y: tgt.y - tgt.h / 2,
          vx: 0,
          vy: -1,
          life: 15,
          c: "#66bb6a",
          r: 3
        });
        g.ft.push({
          x: tgt.x,
          y: tgt.y - tgt.h - 8,
          t: `+${wpn.hl}`,
          life: 18,
          c: "#66bb6a"
        });
      }
    }
    // Healers stay behind other monsters
    const frontAlly = g.enemies.find(e => e !== en && !e.carried && e.hp > 0 && e.x < en.x - 20);
    if (frontAlly) {
      en.x -= spd * 0.3;
    } else {
      en.x -= spd * 0.6;
    }
    en.y = cl(en.y, GY - 22, GY + 14);
    if (en.x < CX + 60) {
      en.atCastle = true;
      en.x = CX + 60;
    }
    return;
  }
  // Swap weapon if empty
  if (brain.can("swapWeapon") && en.wpn2 && wpn && wpn.cur <= 0 && !en.useW2) en.useW2 = true;
  // Retreat if almost dead
  if (brain.can("retreat") && en.hp < en.mhp * 0.15 && !en.retreated) {
    en.retreating = true;
  }
  if (en.retreating) {
    en.x += spd * 0.5;
    en.hp = Math.min(en.mhp, en.hp + 0.4);
    if (en.hp > en.mhp * 0.5 || en.x >= W - 20) {
      en.retreating = false;
      en.retreated = true;
    }
    return;
  }
  // At castle = smash it
  if (en.atCastle) {
    en.aCd--;
    if (en.aCd <= 0) {
      const dm = wpn ? Math.max(2, ~~(wpn.d * 0.5)) : 3;
      g.hp -= dm;
      en.aCd = wpn ? ~~(wpn.rt * 1.4) : 55;
      for (let p = 0; p < 4; p++) g.parts.push({
        x: CX + rn(5, 35),
        y: GY - rn(10, 50),
        vx: rn(-3, 3),
        vy: rn(-3, 0),
        life: 16,
        c: "#ff1744",
        r: 3
      });
      g.ft.push({
        x: CX + rn(10, 40),
        y: GY - rn(30, 70),
        t: `-${dm}`,
        life: 25,
        c: "#ff1744"
      });
    }

        stn: wpn.stn

  }

function heroTick(h, g) {
  if (h.hp <= 0) return;
  let tar = null,
    minD = 9999;
  for (const en of g.enemies) {
    if (en.carried) continue;
    const d = D(h.x, h.y, en.x, en.y);
    if (d < minD) {
      minD = d;
      tar = en;
    }
  }
  const home = h.homeX || CX + 60;
  if (tar && minD < 380) {
    const dx = tar.x - h.x,
      dy = tar.y - h.y,
      di = Math.max(1, Math.sqrt(dx * dx + dy * dy));
    if (di > h.range) {
      h.x += dx / di * h.spd;
      h.y += dy / di * h.spd * 0.3;
    }
    h.y = cl(h.y, GY - 25, GY + 10);
    h.facing = dx > 0 ? 1 : -1;
    if (minD < h.range + (tar.w || 20) / 2 + 10) {
      h.cd = Math.max(0, h.cd - 1);
      if (h.cd <= 0) {
        let dmg = h.damage;
        const forge = g.bSlots.find(b => b && b.id === "forge");
        if (forge) dmg = ~~(dmg * BLDGS.forge.ef(forge.lvl).mul);
        const actual = Math.max(1, dmg - (tar.arm || 0));
        tar.hp -= actual;
        h.cd = h.fireRate;
        g.ft.push({
          x: tar.x,
          y: tar.y - tar.h - 8,
          t: `-${actual}`,
          life: 22,
          c: "#ef5350"
        });
        if (h.heals) g.hp = Math.min(g.hp + h.heals, g.maxHp);
        if (h.splash) {
          for (const e2 of g.enemies) if (e2 !== tar && !e2.carried && D(tar.x, tar.y, e2.x, e2.y) < h.splash) e2.hp -= ~~(actual * 0.5);
        }
      }
    }
  } else {
    if (Math.abs(h.x - home) > 5) h.x += (home - h.x) * 0.04;
    h.y += (GY - h.y) * 0.05;
    h.facing = 1;
  }
}

  // ÷ AI-analyse av tegningen — heuristisk
  // Leser piksel-data og foreslår stats basert på farger, størrelse og symmetri
  const analyzeDrawing = useCallback((pixels) => {
    if (!pixels || !pixels.length) return null;
    const SIZE = pixels.length;
    let painted = 0, totalR=0, totalG=0, totalB=0;
    const colorSet = new Set();
    let topRow = -1, botRow = -1, leftCol = SIZE, rightCol = -1;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const px = pixels[r][c];
      if (!px) continue;
      painted++;
      colorSet.add(px);
      const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(px);
      if (m) {
        totalR += parseInt(m[1], 16);
        totalG += parseInt(m[2], 16);
        totalB += parseInt(m[3], 16);
      }
      if (topRow < 0) topRow = r;
      botRow = r;
      if (c < leftCol) leftCol = c;
      if (c > rightCol) rightCol = c;
    }
    if (painted === 0) return null;
    const avgR = totalR / painted, avgG = totalG / painted, avgB = totalB / painted;
    // Sjekk venstre/høyre symmetri
    let symMatches = 0, symChecks = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE/2; c++) {
      const a = pixels[r][c], b = pixels[r][SIZE-1-c];
      if (a || b) { symChecks++; if ((a && b) || (!a && !b)) symMatches++; }
    }
    const symmetry = symChecks > 0 ? symMatches / symChecks : 0;
    const width = rightCol - leftCol + 1;
    const height = botRow - topRow + 1;
    // Bestem element/tema fra dominant farge
    let element = "neutral", elementName = "Skapning";
    if (avgR > avgG && avgR > avgB) { element = "fire"; elementName = "Ildvesen"; }
    else if (avgB > avgR && avgB > avgG) { element = "water"; elementName = "Iskaldt"; }
    else if (avgG > avgR && avgG > avgB) { element = "nature"; elementName = "Skogvesen"; }
    else if (avgR > 150 && avgG > 150 && avgB < 100) { element = "sun"; elementName = "Solild"; }
    else if (avgR > 100 && avgB > 100 && avgG < 100) { element = "shadow"; elementName = "Skyggevesen"; }
    else if (avgR < 80 && avgG < 80 && avgB < 80) { element = "void"; elementName = "Tomhet"; }
    // Foreslåtte stats — skalert med tegningens størrelse og kompleksitet
    const sizeScore = painted / (SIZE * SIZE);   // 0..1
    const complexityScore = colorSet.size / 8;   // 0..1+ (cap'es senere)
    const isLikelyBoss = symmetry > 0.85 && painted > SIZE * SIZE * 0.3;
    const baseHp = Math.round(40 + sizeScore * 200 + complexityScore * 60);
    const baseDmg = Math.round(4 + complexityScore * 12 + (element === "fire" ? 4 : 0));
    const baseSpd = element === "shadow" ? 2.6 : element === "void" ? 0.8 : 1.5;
    return {
      name: elementName,
      element,
      stats: {
        hp: isLikelyBoss ? baseHp * 3 : baseHp,
        dmg: baseDmg,
        spd: baseSpd,
        rew: Math.max(2, Math.round(painted / 12)),
        armor: Math.round(complexityScore * 3),
        shoots: complexityScore > 0.4,        // foreslår skyting hvis > 4 farger
        shootRange: 220,
        shootDmg: Math.max(2, Math.round(baseDmg * 0.6)),
        shootRate: 60,
        hasSplash: element === "fire",
        isFlying: false,
        isElite: complexityScore > 0.6 && !isLikelyBoss,
        isBoss: isLikelyBoss
      },
      hint: isLikelyBoss

  // ÷ KI-analyse for helt-tegning (returnerer foreslått hero-def)
  const analyzeHeroDrawing = useCallback((pixels) => {
    if (!pixels || !pixels.length) return null;
    const SIZE = pixels.length;
    let painted = 0, totalR=0, totalG=0, totalB=0;
    const colorSet = new Set();
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const px = pixels[r][c];
      if (!px) continue;
      painted++;
      colorSet.add(px);
      const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(px);
      if (m) { totalR += parseInt(m[1],16); totalG += parseInt(m[2],16); totalB += parseInt(m[3],16); }
    }
    if (painted === 0) return null;
    const avgR = totalR / painted, avgG = totalG / painted, avgB = totalB / painted;
    const sizeScore = painted / (SIZE * SIZE);
    const complexityScore = colorSet.size / 8;
    let cls = "bue", color = "#9e9e9e", name = "Helten", hint = "Standard helt";
    if (avgR > avgG && avgR > avgB && avgB < 100) {
      cls = "magi"; color = "#ef5350"; name = "Ildmagiker"; hint = "Rød = magiker (ild)";
    } else if (avgB > avgR && avgB > avgG) {
      cls = "magi"; color = "#42a5f5"; name = "Vannmagiker"; hint = "Blå = magiker (vann)";
    } else if (avgG > avgR && avgG > avgB) {
      cls = "bue"; color = "#66bb6a"; name = "Skogskytter"; hint = "Grønn = bueskyter";
    } else if (avgR > 100 && avgG > 100 && avgB < 100) {
      cls = "pistol"; color = "#ffd54f"; name = "Gullskytter"; hint = "Gul = pistolskytter";
    } else if (avgR > 150 && avgG > 150 && avgB > 150) {
      cls = "stjerne"; color = "#ffd700"; name = "Lysets helt"; hint = "Lys = stjernehelt";
    } else {
      cls = "bue"; color = "#90a4ae"; name = "Standardhelt"; hint = "Nøytral = bueskyter";
    }
    return {
      name, cls, color, hint,
      cost: Math.max(20, Math.round(50 + sizeScore * 200 + complexityScore * 500)),
      dmg: Math.max(3, Math.round(5 + complexityScore * 15)),
      rng: Math.round(200 + complexityScore * 200),
      fr: Math.max(15, Math.round(60 - complexityScore * 30)),
      crit: Math.round(complexityScore * 25),
      spl: complexityScore > 0.5 ? 25 : 0,
      slow: 0
    };
  }, []);

  const pickDiaUpgrade = useCallback((treeIdx, tier, choiceIdx) => {

  // ═══ GAME LOOP ═══
  useEffect(() => {
    if (ui.phase !== "playing") return;
    const canvas = cvs.current,
      ctx = canvas.getContext("2d");
    const cls = Array.from({
      length: 6
    }, () => ({
      x: rn(0, W),
      y: rn(20, 90),
      w: rn(40, 70),
      s: rn(0.08, 0.15)
    }));
    const loop = () => {
      const g = gR.current;
      if (!g) return;
      const spd = spdRef.current;
      for (let _s = 0; _s < spd; _s++) {
        g.tick++;
        // ÷ Eksponer game-state for AI-skrevet customLogic via BX_HERO_HELPERS
        window._BX_GAME = g;
        // ÷ Admin: uendelig penger — fyller opp hver 30. tick (~ 0.5 sek)
        if (g._adminInfMoney && g.tick % 30 === 0) {
          g.money = Math.max(g.money, 999999);
          g.dia = Math.max(g.dia, 9999);
        }
        if (g.waveActive && g.wD) {
          g.wD.timer--;
          if (g.wD.timer <= 0 && g.wD.sp < g.wD.total) {
            g.enemies.push(spawnMon(g.wave, false, g.brain, g.wD));
            g.wD.sp++;
            g.wD.timer = g.wD.int;
          }
          if (g.wD.boss && g.wD.bsp < (g.wD.bossCount || 1) && g.wD.sp >= ~~(g.wD.total * (0.5 + g.wD.bsp * 0.15))) {
            g.enemies.push(spawnMon(g.wave, true, g.brain, g.wD));
            g.wD.bsp++;
          }
          if (g.wD.sp >= g.wD.total) {
            if (g.enemies.length === 0) {
              g.waveActive = false;
              g.brain.evolve(g);
              // ÷ Penger redusert med 70 % (fra "12 + wave*5" til "~30%")
              let bonus = Math.max(2, ~~((12 + g.wave * 5) * 0.30));
              const bank = g.bSlots.find(b => b && b.id === "bank");
              if (bank) bonus += ~~(BLDGS.bank.ef(bank.lvl).gpr * 0.30);
              const gm = g.bSlots.find(b => b && b.id === "goldmine");
              if (gm) bonus += ~~(BLDGS.goldmine.ef(gm.lvl).gpr * 0.30);
              if (g._mathPenalty) { bonus = Math.floor(bonus * 0.4); g._mathPenalty = false; }
              g.money += bonus + (g._pendingReward || 0);
              g._pendingReward = 0;
              // Show math question after wave if enabled
              if (g._mathEnabled) {
                g._mathPendingQ = window.BX_MATH.gen(g._mathCfg || {types:['add','sub'],difficulty:'medium'});
              }
              // ÷ Diamanter redusert kraftig: én hver 8. bølge i stedet for hver bølge
              let diaReward = (g.wave % 8 === 0 && g.wave > 0) ? 1 : 0;
              if (g.wave % 24 === 0 && g.wave > 0) diaReward += 1; // bonus hvert 24. wave
              const dm = g.bSlots.find(b => b && b.id === "diamondmine");
              if (dm && g.wave % 4 === 0) diaReward += 1; // diamantgruve gir litt mer, men sjeldnere
              g.dia += diaReward + (g.diaBonusFlat || 0);
              // ═══ PLAYER XP from completing wave ═══
              g.pXp = (g.pXp || 0) + 10 + g.wave * 4;
              // Level-up loop (kan hoppe flere nivåer på en gang)
              g.pLevel = g.pLevel || 1;
              while (g.pXp >= xpForLevel(g.pLevel + 1)) {
                g.pLevel++;
                g.ft.push({
                  x: W / 2,
                  y: GY - 180,
                  t: "🎉 LEVEL UP! Du er nå level " + g.pLevel,
                  life: 140,
                  c: "#4fc3f7"
                });
                // Hver level gir litt diamant og helse-boost
                g.dia += 1;
                g.maxHp += 25;
                g.hp = Math.min(g.maxHp, g.hp + 50);
              }
              const hosp = g.bSlots.find(b => b && b.id === "hospital");
              if (hosp) {
                const ef = BLDGS.hospital.ef(hosp.lvl);
                for (const fl of g.floors) for (const h of fl) if (h && h.hp > 0) h.hp = Math.min(h.hp + ~~(h.maxHp * ef.hp), h.maxHp);
              }
              // Skill point on boss waves (global class tree)
              if (g.wave % 3 === 0 && g.classPick) {
                g.classSkillPts = (g.classSkillPts || 0) + 1;
                g.ft.push({
                  x: W / 2,
                  y: GY - 160,
                  t: "🌟 +1 Skill Point!",
                  life: 90,
                  c: "#ffd54f"
                });
              }
              g.ft.push({
                x: W / 2,
                y: GY - 140,
                t: `✅ Bølge ${g.wave}! +${bonus}💰 +${diaReward}💎`,
                life: 100,
                c: "#ffd54f"
              });
              // ÷ Butikk-mynter for fullført bølge (persistent — brukes til pakker)
              try {
                const coinEarn = 10 + g.wave * 2;
                BX_COINS_ADD(coinEarn);
                g.ft.push({ x: W / 2, y: GY - 118, t: "+" + coinEarn + " 🪙", life: 90, c: "#ffe082" });
              } catch(e) {}
              // CASTLE LEVEL UP every 10 waves
              if (g.wave % 10 === 0) {
                g.castleLevelUp = true;
                g.ft.push({
                  x: W / 2,
                  y: GY - 165,
                  t: `🏰 TÅRN LEVEL OPP! Velg oppgradering!`,
                  life: 120,
                  c: "#4fc3f7"
                });
              }
              // AUTO-SAVE after each wave
              const as = uiRef.current?.activeSlot;
              if (as != null) saveGame(as);
              sync();
            }
          }
        }
        // Moat slows, barricade slows
        if (g.moat || g.barricade) {
          const sx = g.moat ? CX + 55 : CX + 52,
            sw = g.moat ? 30 : 28;
          for (const en of g.enemies) {
            if (!en.carried && en.x > sx && en.x < sx + sw) {
              en.vx = (en.vx || 0) * 0.5;
            }
          }
        }
        for (const en of g.enemies) {
          monsterTick(en, g);
          if (en.dot > 0 && g.tick % 30 === 0) {
            en.dot = Math.max(0, en.dot - 0.5);
          }
        }
        // Castle defense
        // Castle contact damage (walls only, no projectiles from tower)
        if (g.tick % 25 === 0) {
          const bd = 2 + ~~(g.cLvl * 0.5);
          for (const en of g.enemies) if (en.atCastle && !en.carried) en.hp -= bd;
        }
        // Melee respawn + death animation
        for (const m of g.melees) {
          if (m && m.hp <= 0) {
            if (!m.deadTimer || m.deadTimer === 0) {
              // JUST DIED - show death animation
              g.ft.push({
                x: m.x,
                y: m.y - 30,
                t: `💀 ${HEROES[m.type]?.n || "Helt"} falt!`,
                life: 50,
                c: "#ef5350"
              });
              for (let p = 0; p < 10; p++) g.parts.push({
                x: m.x,
                y: m.y - 10,
                vx: rn(-3, 3),
                vy: rn(-4, -1),
                life: 20,
                c: HEROES[m.type]?.c || "#fff",
                r: rn(2, 5)
              });
            }
            m.deadTimer = (m.deadTimer || 0) + 1;
            if (m.deadTimer >= (m.rsp || 600)) {
              m.hp = m.maxHp;
              m.deadTimer = 0;
              m.x = m.homeX || CX + 60;
              m.y = GY;
              g.ft.push({
                x: m.x,
                y: m.y - 30,
                t: `✨ ${HEROES[m.type]?.n || "Helt"} gjenoppstod!`,
                life: 40,
                c: "#66bb6a"
              });
              for (let p = 0; p < 6; p++) g.parts.push({
                x: m.x + rn(-10, 10),
                y: m.y - rn(5, 25),
                vx: rn(-1, 1),
                vy: rn(-3, -1),
                life: 18,
                c: "#66bb6a",
                r: 3
              });
            }
          }
        }
        // Floor hero death + respawn (ranged heroes on castle)
        for (const fl of g.floors) for (const h of fl) {
          if (!h || !h.maxHp) continue;
          if (h.hp <= 0) {
            if (!h.deadTimer || h.deadTimer === 0) {
              // JUST DIED
              g.ft.push({
                x: h.x || CX,
                y: (h.y || GY) - 30,
                t: `💀 ${HEROES[h.type]?.n || "Helt"} falt!`,
                life: 50,
                c: "#ef5350"
              });
              for (let p = 0; p < 8; p++) g.parts.push({
                x: h.x || CX,
                y: (h.y || GY) - 15,
                vx: rn(-2, 2),
                vy: rn(-3, -1),
                life: 18,
                c: HEROES[h.type]?.c || "#fff",
                r: rn(2, 4)
              });
            }
            h.deadTimer = (h.deadTimer || 0) + 1;
            if (h.deadTimer >= (h.rsp || 600)) {
              h.hp = h.maxHp;
              h.deadTimer = 0;
              g.ft.push({
                x: h.x || CX,
                y: (h.y || GY) - 30,
                t: `✨ ${HEROES[h.type]?.n || "Helt"} gjenoppstod!`,
                life: 40,
                c: "#66bb6a"
              });
            }
          }
        }
        for (let mi = 0; mi < g.melees.length; mi++) {
          const m = g.melees[mi];
          if (!m || m.hp <= 0) continue;
          m.slot = mi;
          heroTick(m, g);
        }
        // Spec cooldowns + active effects
        const allHeroes = [...g.melees];
        for (const fl of g.floors) allHeroes.push(...fl);
        for (const h of allHeroes) {
          if (!h) continue;
          if (h.specCd > 0) h.specCd--;
          // AUTO-SPEC: Use special ability automatically when ready + enemies on field
          if (h.specCd <= 0 && h.hp > 0 && g.enemies.length > 0) {
            const hd2 = HEROES[h.type];
            if (hd2 && hd2.spec) {
              let found = false;
              for (let fi = 0; fi < g.floors.length && !found; fi++) for (let si = 0; si < g.floors[fi].length; si++) if (g.floors[fi][si] === h) {
                useSpec(fi, si, false);
                found = true;
                break;
              }
              if (!found) for (let mi = 0; mi < g.melees.length; mi++) if (g.melees[mi] === h) {
                useSpec(0, mi, true);
                found = true;
                break;
              }
              if (!found) h.specCd = hd2.spec.cd; // safety fallback
            }
          }
          if (h.specActive > 0) {
            h.specActive--;
            if (h.specActive <= 0) {
              if (h.type === "golem_h") h.armor = 0;
              applySkills(h, g); // recalculate all stats
            }
          }
        }
        // ═══ SUMMON AI ═══
        for (let si = g.summons.length - 1; si >= 0; si--) {
          const s = g.summons[si];
          s.life--;
          if (s.life <= 0 || s.hp <= 0) {
            g.ft.push({
              x: s.x,
              y: s.y - s.h - 5,
              t: "💨",
              life: 20,
              c: s.c
            });
            for (let p = 0; p < 5; p++) g.parts.push({
              x: s.x,
              y: s.y - s.h / 2,
              vx: rn(-3, 3),
              vy: rn(-4, -1),
              life: 15,
              c: s.c,
              r: 3
            });
            g.summons.splice(si, 1);
            continue;
          }
          // Find nearest enemy
          let tar = null,
            td = 9999;
          for (const en of g.enemies) {
            if (en.carried) continue;
            const d = D(s.x, s.y, en.x, en.y);
            if (d < td) {
              td = d;
              tar = en;
            }
          }
          if (!tar) continue;
          // Move toward enemy (unless stationary)
          if (!s.stationary) {
            if (td > s.rng + 10) {
              const dx = tar.x - s.x,
                dy = tar.y - s.y,
                di = Math.max(1, Math.sqrt(dx * dx + dy * dy));
              s.x += dx / di * s.spd;
              if (!s.isFlying) s.y = cl(s.y + dy / di * s.spd * 0.3, GY - 28, GY + 12);
            }
            if (s.isFlying) s.y = GY - 25 + Math.sin(s.life * 0.06) * 10;
          }
          // Attack (cooldown)
          s.cd = Math.max(0, s.cd - 1);
          if (s.cd > 0) continue;
          if (td > s.rng + (tar.w || 16)) continue; // out of range
          s.cd = s.fr;
          const actual = Math.max(1, s.dmg - (tar.arm || 0));
          // Ranged summons shoot projectiles
          if (s.stationary || s.isFlying || s.rng > 60) {
            const a = Math.atan2(tar.y - tar.h / 2 - s.y, tar.x - s.x);
            const sp = s.isFlying ? 7 : 6;
            g.proj.push({
              x: s.x,
              y: s.y - s.h / 2,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp,
              dmg: s.dmg,
              c: s.c,
              life: 60,
              r: 4,
              ht: s.owner || "summoner",
              chain: 0
            });
            g.parts.push({
              x: s.x,
              y: s.y - s.h / 2,
              vx: Math.cos(a) * 2,
              vy: Math.sin(a) * 2,
              life: 8,
              c: s.c,
              r: 2
            });
          } else {
            // Melee summons hit directly
            if (tar.shield > 0) {
              const abs = Math.min(tar.shield, actual);
              tar.shield -= abs;
              tar.hp -= actual - abs;
            } else tar.hp -= actual;
            g.parts.push({
              x: tar.x,
              y: tar.y - tar.h / 2,
              vx: rn(-2, 2),
              vy: -2,
              life: 10,
              c: s.c,
              r: 3
            });
            g.ft.push({
              x: tar.x,
              y: tar.y - tar.h - 6,
              t: `-${actual}`,
              life: 18,
              c: s.c
            });
          }
        }
        // ═══ CASTLE WEAPON (innebygd) ═══
        g.castleCd = (g.castleCd || 0) - 1;
        if (g.castleCd <= 0 && g.enemies.length > 0) {
          const castleDmg = 3 + g.wave * 2 + g.cLvl * 3;
          const castleRng = 180 + g.cLvl * 20;
          let ctar = null,
            cmd = 9999;
          for (const en of g.enemies) {
            if (en.carried) continue;
            const d = D(CX, GY - 40, en.x, en.y);
            if (d < castleRng && d < cmd) {
              cmd = d;
              ctar = en;
            }
          }
          if (ctar) {
            g.castleCd = Math.max(15, 40 - g.cLvl * 3);
            const a = Math.atan2(ctar.y - ctar.h / 2 - (GY - 40), ctar.x - CX);
            g.proj.push({
              x: CX,
              y: GY - 40,
              vx: Math.cos(a) * 8,
              vy: Math.sin(a) * 8,
              dmg: castleDmg,
              c: "#ffd54f",
              life: 50,
              r: 4,
              ht: "castle",
              chain: 0
            });
            g.parts.push({
              x: CX,
              y: GY - 42,
              vx: Math.cos(a) * 3,
              vy: Math.sin(a) * 3 - 1,
              life: 8,
              c: "#ffd54f",
              r: 2
            });
          }
        }
        // Shrine
        const shr = g.bSlots.find(b => b && b.id === "shrine");
        if (shr && g.tick % 30 === 0) {
          const r = BLDGS.shrine.ef(shr.lvl).reg;
          for (const fl of g.floors) for (const h of fl) if (h && h.hp > 0 && h.hp < h.maxHp) h.hp = Math.min(h.hp + ~~r, h.maxHp);
        }
        // All attacking buildings shoot from their positions

        // ═══ WALL — blocks enemies ═══
        if (g.wall && g.wall.hp > 0) {
          for (const en of g.enemies) {
            if (!en.carried && en.x <= g.wall.wx + 10 && en.x >= g.wall.wx - 4) {
              if (!en.wallCd) en.wallCd = 0;
              en.wallCd--;
              if (en.wallCd <= 0) {
                en.wallCd = 30;
                g.wall.hp -= Math.max(1, en.dmg || 5);
                if (g.wall.hp <= 0) {
                  g.ft.push({
                    x: g.wall.wx,
                    y: GY - 60,
                    t: "💥 Muren ødelegg!",
                    life: 80,
                    c: "#ef5350"
                  });
                  g.wall = null;
                  break;
                }
              }
            }
          }
        }
        for (let fi = 0; fi < g.floors.length; fi++) {
          for (let si = 0; si < 3; si++) {
            const hero = g.floors[fi][si];
            if (!hero) continue;
            hero.cd = Math.max(0, hero.cd - 1);
            if (hero.cd > 0) continue;
            const hx = CX + 30,
              hy = slotY(fi, si);
            const hd = HEROES[hero.type];
            if (!hd) continue;
            // ÷ Stjernehelt har ingen våpen — passiv (revive) håndteres ved fiende-død
            if (hd.raises) { hero.cd = 30; continue; }
            if (hd.healAmt) {
              let lH = null,
                lP = 0.9;
              for (const m of g.melees) {
                if (m && m.hp > 0 && m.hp < m.maxHp) {
                  const p = m.hp / m.maxHp;
                  if (p < lP) {
                    lP = p;
                    lH = m;
                  }
                }
              }
              if (lH && lP < 0.9) {
                hero.cd = hero.fireRate;
                const ha = (hd.healAmt || 8) + hero.level * 3;
                lH.hp = Math.min(lH.maxHp, lH.hp + ha);
                g.ft.push({
                  x: lH.x,
                  y: lH.y - 45,
                  t: `+${ha}`,
                  life: 18,
                  c: "#e91e63"
                });
              }
              continue;
            }
            let tar = null,
              md = 999;
            for (const en of g.enemies) {
              if (en.carried) continue;
              const d = D(hx, hy, en.x, en.y - en.h / 2);
              if (d < hero.range && d < md) {
                md = d;
                tar = en;
              }
            }
            if (tar) {
              hero.cd = hero.fireRate;
              let dmg = hero.damage;
              const forge = g.bSlots.find(b => b && b.id === "forge");
              if (forge) dmg = ~~(dmg * BLDGS.forge.ef(forge.lvl).mul);
              const a = Math.atan2(tar.y - tar.h / 2 - hy, tar.x - hx);
              // ÷ Skuddtelling: alwaysShots = fast antall, multishot = level-basert
              let shots = 1;
              if (hd.alwaysShots) {
                shots = hd.alwaysShots;
              } else if (hd.multishot) {
                const lv = hero.level || 0;
                if (lv >= 200) shots = 3 + Math.floor((lv - 100) / 100);
                else if (lv >= 100) shots = 3;
                else if (lv >= 10) shots = 2;
              }
              const spreadDeg = (shots - 1) * 5;       // total spredning i grader
              for (let sh = 0; sh < shots; sh++) {
                const offset = shots === 1 ? 0 : ((sh / (shots - 1)) - 0.5) * spreadDeg * Math.PI / 180;
                g.proj.push({
                  x: hx + 16,
                  y: hy,
                  vx: Math.cos(a + offset) * (hd.ps || 6),
                  vy: Math.sin(a + offset) * (hd.ps || 6),
                  dmg,
                  c: hd.pc || hd.c,
                  ht: hero.type,
                  life: 85,
                  r: hd.spl ? 6 : 3,
                  chain: hero.chain || hd.chain,
                  dotH: hero.dotH || hd.dotH,
                  drain: hero.drain || hd.drain
                });
              }
            }
          }
        }
        // Floor weapons (innate per slot)
        const fwLvl = (g.floorGunLvl || 0) + 1;
        if (!g.floorWpnCds) g.floorWpnCds = [];
        for (let fi = 0; fi < g.floors.length; fi++) {
          const fw = FLOOR_WEAPONS_INNATE[Math.min(fi + ~~(g.cLvl / 2), FLOOR_WEAPONS_INNATE.length - 1)];
          for (let si = 0; si < 3; si++) {
            const cdKey = fi * 3 + si;
            if (!g.floorWpnCds[cdKey]) g.floorWpnCds[cdKey] = 0;
            g.floorWpnCds[cdKey] = Math.max(0, g.floorWpnCds[cdKey] - 1);
            if (g.floorWpnCds[cdKey] > 0) continue;
            const hx = CX + 30,
              hy = slotY(fi, si);
            let tar = null,
              md = 9999;
            for (const en of g.enemies) {
              if (en.carried) continue;
              const d = D(hx, hy, en.x, en.y);
              if (d < fw.rng(fwLvl) && d < md) {
                md = d;
                tar = en;
              }
            }
            if (!tar) continue;
            g.floorWpnCds[cdKey] = fw.rate(fwLvl);
            const a = Math.atan2(tar.y - tar.h / 2 - hy, tar.x - hx);
            g.proj.push({
              x: hx,
              y: hy,
              vx: Math.cos(a) * 9,
              vy: Math.sin(a) * 9,
              dmg: fw.dmg(fwLvl),
              c: fw.c,
              ht: "castle",
              life: 70,
              r: fw.spl ? 4 : 2,
              spl: fw.spl ? fw.spl(fwLvl) : 0,
              chain: fw.chain ? fw.chain(fwLvl) : 0
            });
          }
        }
        // Wall blocks and absorbs damage
        if (g.wall && g.wall.hp > 0) {
          const wx = g.wall.wx || CX + 35;
          for (const en of g.enemies) {
            if (!en.carried && en.x < wx + 10 && en.x > wx - 10) {
              en.x = wx + 10;
              en.vx = 0; // stop at wall
              if (g.tick % 15 === 0) {
                g.wall.hp = Math.max(0, g.wall.hp - Math.max(1, en.atk || 5));
                if (g.wall.spikes) en.hp -= 8;
              } // spike damage
              if (g.wall.hp <= 0) {
                g.ft.push({
                  x: wx,
                  y: GY - 60,
                  t: "🧱 Mur ødelagt!",
                  life: 80,
                  c: "#ef5350"
                });
                g.wall = null;
              }
            }
          }
        }
        // ÷ CUSTOM-PROSJEKTILER (fra AI-kodede helter — røde baller, etc.)
        if (g.customProj) {
          for (let ci = g.customProj.length - 1; ci >= 0; ci--) {
            const p = g.customProj[ci];
            p.life--;
            // Hvis målet er dødt: finn ny nærmeste
            if (!p.target || p.target.hp <= 0) {
              let best = null, bestD = 9999;
              for (const e of g.enemies) {
                if (e.hp <= 0 || e.carried) continue;
                const d = Math.hypot(e.x - p.x, e.y - p.y);
                if (d < bestD) { bestD = d; best = e; }
              }
              if (best) p.target = best;
              else { g.customProj.splice(ci, 1); continue; }
            }
            const dx = p.target.x - p.x;
            const dy = (p.target.y - (p.target.h||20)/2) - p.y;
            const d = Math.hypot(dx, dy) || 1;
            p.x += (dx/d) * p.spd;
            p.y += (dy/d) * p.spd;
            // Treff?
            if (d < (p.target.w || 20)/2 + p.size + 2) {
              if (p.splash > 0) {
                for (const e of g.enemies) {
                  if (e.hp <= 0 || e.carried) continue;
                  const dd = Math.hypot(e.x - p.x, e.y - p.y);
                  if (dd <= p.splash) {
                    const dmg = Math.max(1, p.dmg - (e.arm||0));
                    e.hp -= dmg;
                    g.ft.push({x: e.x, y: e.y - 12, t: "-"+dmg, life: 18, c: p.color});
                    if (p.slow) e.sl = Math.max(e.sl||0, p.slow);
                    if (p.dot) e.dot = Math.max(e.dot||0, p.dot);
                  }
                }
                for (let k = 0; k < 8; k++) {
                  g.parts.push({
                    x: p.x, y: p.y,
                    vx: Math.cos(k/8*Math.PI*2) * 3,
                    vy: Math.sin(k/8*Math.PI*2) * 3,
                    life: 20, r: 3, c: p.color
                  });
                }
              } else {
                const dmg = Math.max(1, p.dmg - (p.target.arm||0));
                p.target.hp -= dmg;
                g.ft.push({x: p.target.x, y: p.target.y - 12, t: "-"+dmg, life: 18, c: p.color});
                if (p.slow) p.target.sl = Math.max(p.target.sl||0, p.slow);
                if (p.dot) p.target.dot = Math.max(p.target.dot||0, p.dot);
              }
              g.customProj.splice(ci, 1);
              continue;
            }
            // Av-skjerm
            if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
              g.customProj.splice(ci, 1);
            }
          }
        }
        // Projectiles
        for (let i = g.proj.length - 1; i >= 0; i--) {
          const p = g.proj[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          if (p.life <= 0 || p.x > W + 30) {
            g.proj.splice(i, 1);
            continue;
          }
          if (p.ht === "healer") continue;
          for (const en of g.enemies) {
            if (en.carried) continue;
            if (Math.abs(p.x - en.x) < en.w / 2 + p.r && Math.abs(p.y - (en.y - en.h / 2)) < en.h / 2 + p.r) {
              const hd = HEROES[p.ht];
              let actual = Math.max(1, p.dmg - (en.arm || 0));
              // Shield absorption (titan boss)
              if (en.shield > 0) {
                const absorbed = Math.min(en.shield, actual);
                en.shield -= absorbed;
                actual -= absorbed;
                g.parts.push({
                  x: en.x,
                  y: en.y - en.h / 2,
                  vx: 0,
                  vy: -1,
                  life: 10,
                  c: "#42a5f5",
                  r: 4
                });
              }
              if (hd && hd.spl) {
                for (const e2 of g.enemies) if (!e2.carried && D(p.x, p.y, e2.x, e2.y - e2.h / 2) < hd.spl) e2.hp -= actual;
              } else {
                en.hp -= actual;
                if (hd && hd.slow) en.sl = Math.max(en.sl, hd.slow);
              }
              if (p.chain) {
                let prev = en,
                  hits = 0;
                for (const e2 of g.enemies) {
                  if (e2 === en || e2.carried || hits >= p.chain) continue;
                  if (D(prev.x, prev.y, e2.x, e2.y) < 120) {
                    e2.hp -= ~~(actual * 0.6);
                    hits++;
                    prev = e2;
                  }
                }
              }
              if (p.dotH) en.dot = (en.dot || 0) + p.dotH;
              if (p.drain) g.hp = Math.min(g.maxHp, g.hp + ~~(actual * 0.3));
              g.proj.splice(i, 1);
              for (let pp = 0; pp < 3; pp++) g.parts.push({
                x: p.x,
                y: p.y,
                vx: rn(-2, 2),
                vy: rn(-2, 2),
                life: 10,
                c: p.c,
                r: 2
              });
              break;
            }
          }
        }
        // Enemy proj
        for (let i = g.eProj.length - 1; i >= 0; i--) {
          const p = g.eProj[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          if (p.life <= 0 || p.x < -30) {
            g.eProj.splice(i, 1);
            continue;
          }
          let hit = false;
          for (const m of g.melees) {
            if (!m || m.hp <= 0) continue;
            if (D(p.x, p.y, m.x, m.y - 15) < 20) {
              m.hp -= Math.max(1, p.dmg);
              g.eProj.splice(i, 1);
              hit = true;
              break;
            }
          }
          // Enemy projectiles also hit castle floor heroes
          if (!hit) {
            for (const fl of g.floors) for (const h of fl) {
              if (!h || h.hp <= 0 || !h.maxHp) continue;
              if (D(p.x, p.y, h.x, h.y - 10) < 22) {
                h.hp -= Math.max(1, p.dmg);
                g.eProj.splice(i, 1);
                hit = true;
                g.ft.push({
                  x: h.x,
                  y: h.y - 20,
                  t: `-${Math.max(1, p.dmg)}`,
                  life: 18,
                  c: "#ff5252"
                });
                break;
              }
              if (hit) break;
            }
          }
          if (!hit && p.x < CX + 40) {
            g.hp -= p.dmg;
            g.eProj.splice(i, 1);
            if (g.hp <= 0) g.hp = 0;
            sync();
          }
        }
        // Cleanup
        for (let i = g.enemies.length - 1; i >= 0; i--) {
          const en = g.enemies[i];
          if (en.x > W + 50) {
            g.enemies.splice(i, 1);
            continue;
          }
          if (en.hp <= 0) {
            // ÷ Drap-belønning redusert med 70 %
            let rew = Math.max(1, ~~((en.rew || 5) * 0.12));
            const bank = g.bSlots.find(b => b && b.id === "bank");
            if (bank) rew += ~~(BLDGS.bank.ef(bank.lvl).gpk * 0.15);
            g._pendingReward = (g._pendingReward || 0) + rew;
            g.score += rew;
            g.kills++;
            // Player XP: littlebit per kill
            g.pXp = (g.pXp || 0) + 1 + (en.boss ? 25 : en.elite ? 5 : 0);
            g.brain.mem.deaths++;

            // ═══ ⭐ STJERNEHELT-REISNING ═══
            // Hvis spilleren har en Stjernehelt på banen og fienden ikke selv var en reist enhet
            if (!en.fromRaise && !en.boss) {
              let starHero = null;
              for (const fl of g.floors) for (const h of fl) if (h && h.type === "stjernehelt" && h.hp > 0) { starHero = h; break; }
              if (starHero) {
                const hd = HEROES.stjernehelt;
                const inRange = D(starHero.x, starHero.y, en.x, en.y) < (starHero.range || 240);
                if (inRange && Math.random() < (hd.raises.chance + (starHero.diaLvl || 0) * 0.10)) {
                  // Reis liket som en alliert summon — bruker zombie-utseende
                  const lifeBonus = (starHero.diaLvl || 0) * 120;
                  g.summons.push({
                    x: en.x,
                    y: GY,
                    hp: Math.max(20, ~~((en.mhp || 50) * hd.raises.hpMul)),
                    mhp: Math.max(20, ~~((en.mhp || 50) * hd.raises.hpMul)),
                    dmg: Math.max(2, ~~((en.dmg || 5) * 1.5)),
                    spd: 1.6,
                    rng: 35,
                    life: hd.raises.lifeFrames + lifeBonus,
                    type: "zombie",       // gjenbruker zombie-sprite
                    c: "#ffd54f",         // gylden tint = reist av stjernehelt
                    w: en.w || 14,
                    h: en.h || 20,
                    cd: 0,
                    fr: 24,
                    owner: "stjernehelt",
                    fromRaise: true
                  });
                  // Visuell effekt
                  g.ft.push({
                    x: en.x,
                    y: en.y - en.h - 5,
                    t: "⭐ Reist!",
                    life: 40,
                    c: "#ffd700"
                  });
                  for (let p = 0; p < 12; p++) {
                    const ang = p / 12 * Math.PI * 2;
                    g.parts.push({
                      x: en.x,
                      y: en.y - en.h / 2,
                      vx: Math.cos(ang) * 3,
                      vy: Math.sin(ang) * 3 - 1,
                      life: 30,
                      c: "#ffd700",
                      r: 3
                    });
                  }
                }
              }
            }
            // ═══ slutt revive ═══
            // DarkRitual: dying enemies heal nearby allies
            if (g.brain.can("darkRitual")) {
              for (const e2 of g.enemies) if (e2 !== en && Math.hypot(e2.x - en.x, e2.y - en.y) < 80) {
                e2.hp = Math.min(e2.mhp, e2.hp + ~~(en.mhp * 0.15));
                g.parts.push({
                  x: e2.x,
                  y: e2.y - e2.h / 2,
                  vx: 0,
                  vy: -2,
                  life: 15,
                  c: "#b388ff",
                  r: 3
                });
              }
            }
            // ═══ DEATH ANIMATION ═══
            g.ft.push({
              x: en.x,
              y: en.y - en.h - 10,
              t: `+${rew}💰`,
              life: 40,
              c: "#ffd54f"
            });
            g.ft.push({
              x: en.x,
              y: en.y - en.h - 20,
              t: "💀",
              life: 30,
              c: "#fff"
            });
            // Big explosion particles
            const pc = en.boss ? 20 : en.isElite ? 12 : 8;
            for (let p = 0; p < pc; p++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = rn(1, en.boss ? 6 : 3);
              g.parts.push({
                x: en.x,
                y: en.y - en.h / 2,
                vx: Math.cos(ang) * spd,
                vy: Math.sin(ang) * spd - 1,
                life: rn(15, 30),
                c: en.boss ? "#ffd54f" : en.col,
                r: en.boss ? rn(3, 7) : rn(2, 5)
              });
            }
            // Blood/smoke ring
            for (let p = 0; p < 6; p++) {
              const ang = p / 6 * Math.PI * 2;
              g.parts.push({
                x: en.x + Math.cos(ang) * en.w * 0.6,
                y: en.y - en.h / 2 + Math.sin(ang) * en.h * 0.3,
                vx: Math.cos(ang) * 2,
                vy: Math.sin(ang) * 1.5 - 1,
                life: 20,
                c: "rgba(100,60,40,0.5)",
                r: en.boss ? 6 : 3
              });
            }
            // Boss death: extra dramatic
            if (en.boss) {
              g.ft.push({
                x: en.x,
                y: en.y - en.h - 35,
                t: "⭐ BOSS DREPT!",
                life: 60,
                c: "#ffd54f"
              });
              for (let p = 0; p < 15; p++) g.parts.push({
                x: en.x + rn(-20, 20),
                y: en.y - en.h / 2 + rn(-15, 15),
                vx: rn(-5, 5),
                vy: rn(-7, -2),
                life: 35,
                c: "#ffd54f",
                r: rn(4, 8)
              });
            }
            // Elite death: gold burst
            if (en.isElite) g.ft.push({
              x: en.x,
              y: en.y - en.h - 25,
              t: "⭐ ELITE!",
              life: 40,
              c: "#ffab00"
            });
            // Screen shake on big kills
            // Ingen risting ved boss/elite drap
            g.enemies.splice(i, 1);
            sync();
          }
        }
        if (g.hp <= 0) {
          g.hp = 0;
          g.waveActive = false;
          g.enemies = [];
          g.eProj = [];
          g.proj = [];
          g.customProj = [];
          g.summons = [];
          g._retrySameWave = true; // tap → prøv samme runde på nytt, ikke endre bølgen (ingenting blir sterkere/flere)
          g.hp = g.maxHp;
          for (const fl of g.floors) for (const h of fl) if (h) {
            h.hp = h.maxHp || 0;
            h.cd = 0;
            h.deadTimer = 0;
            h.specCd = 0;
          }
          for (const m of g.melees) if (m) {
            m.hp = m.maxHp;
            m.cd = 0;
            m.deadTimer = 0;
            m.specCd = 0;
          }
          g.ft.push({
            x: W / 2,
            y: GY - 120,
            t: "💀 Slottet falt! Prøv igjen!",
            life: 120,
            c: "#ef5350"
          });
          g.money += 30;
          // ÷ Når du taper OG matte er skrudd PÅ: nytt mattespørsmål (respekterer av/på-knappen 🧮).
          //   Monstrene forblir like sterke (samme bølge). Matte AV = ingen spørsmål, verken ved tap eller seier.
          if (g._mathEnabled) {
            const rq = window.BX_MATH.gen(g._mathCfg || { types: ['add', 'sub'], difficulty: 'medium' });
            rq.rescue = true;
            g._mathPendingQ = rq;
          }
          sync();
          break;
        }
        for (let i = g.parts.length - 1; i >= 0; i--) {
          const p = g.parts[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.12;
          p.vx *= 0.95;
          p.life--;
          if (p.life <= 0) g.parts.splice(i, 1);
        }
        for (let i = g.ft.length - 1; i >= 0; i--) {
          g.ft[i].y -= 0.8;
          g.ft[i].life--;
          if (g.ft[i].life <= 0) g.ft.splice(i, 1);
        }
        if (g.tick % 30 === 0) sync();
      }
      if (g.hp <= 0) {
        g.hp = g.maxHp;
        sync();
      }

      // ═══ RENDER ═══
      const t = g.tick;
      const bgS = BG_SKINS[g.bgSkin || ""];
      const sky = ctx.createLinearGradient(0, 0, 0, GY);
      sky.addColorStop(0, (bgS && bgS.sky[0]) || "#7ec8ff");
      sky.addColorStop(0.3, (bgS && bgS.sky[1]) || "#a8ddff");
      sky.addColorStop(1, (bgS && bgS.sky[2]) || "#dff3ff");
      // Screen shake
      const shk = g.shake || 0;
      if (shk > 0) {
        ctx.save();
        ctx.translate(rn(-shk, shk), rn(-shk, shk));
        g.shake = Math.max(0, shk - 0.3);
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, GY);
      // Stars
      for (let i = 0; i < 60; i++) {
        ctx.globalAlpha = 0.3 + Math.sin(t * 0.02 + i * 2.1) * 0.2;
        ctx.fillStyle = i % 7 === 0 ? "#ffe082" : "#fff";
        ctx.beginPath();
        ctx.arc((i * 137.5 + 47) % W, (i * 73.3 + 12) % (GY - 80), 0.4 + i % 4 * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // Moon
      ctx.fillStyle = "rgba(255,255,230,0.5)";
      ctx.beginPath();
      ctx.arc(720, 50, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,220,0.06)";
      ctx.beginPath();
      ctx.arc(720, 50, 30, 0, Math.PI * 2);
      ctx.fill();
      // Mountains
      ctx.fillStyle = (bgS && bgS.mountain) || "#7ec850";
      ctx.beginPath();
      ctx.moveTo(0, GY);
      ctx.lineTo(60, GY - 105);
      ctx.lineTo(160, GY - 65);
      ctx.lineTo(280, GY - 120);
      ctx.lineTo(400, GY - 70);
      ctx.lineTo(520, GY - 95);
      ctx.lineTo(680, GY - 55);
      ctx.lineTo(W, GY - 80);
      ctx.lineTo(W, GY);
      ctx.fill();
      // Ground
      const grd = ctx.createLinearGradient(0, GY, 0, H);
      grd.addColorStop(0, (bgS && bgS.ground[0]) || "#8fd94f");
      grd.addColorStop(1, (bgS && bgS.ground[1]) || "#5fae37");
      ctx.fillStyle = grd;
      ctx.fillRect(0, GY, W, H - GY);
      // Path
      ctx.fillStyle = "rgba(80,60,40,0.25)";
      ctx.fillRect(CX + 40, GY - 3, W - CX - 40, 6);
      // ÷ Bakgrunn-skin tekstur-dekor (planeter/snø/trær osv.)
      if (bgS && typeof bgS.drawFn === "function") { try { bgS.drawFn(ctx, W, GY, H, g.tick || 0); } catch(e) {} }
      // ═══ MONSTER FORT (right side) ═══
      const mfx = W - 45,
        mfy = GY;
      const era = getEra(g.wave);
      const fortSk = FORT_SKINS[g.fortSkin || ""];
      const fortC = (fortSk && fortSk.color) || (era >= 4 ? "#311b92" : era >= 3 ? "#37474f" : era >= 2 ? "#5d4037" : era >= 1 ? "#795548" : "#6d4c41");
      const fortH = 28 + Math.min(g.wave * 0.8, 40); // grows with waves
      // Fort base
      ctx.fillStyle = fortC;
      ctx.fillRect(mfx - 18, mfy - fortH, 36, fortH);
      // ÷ Fort-skin tekstur (mønster oppå kroppen)
      if (fortSk && typeof fortSk.drawFn === "function") { try { fortSk.drawFn(ctx, mfx, mfy, fortH, g.tick || 0); } catch(e) {} }
      ctx.fillStyle = era >= 3 ? "#455a64" : "#4e342e";
      ctx.fillRect(mfx - 22, mfy - fortH - 4, 44, 6); // top
      ctx.fillStyle = era >= 3 ? "#263238" : "#3e2723";
      ctx.fillRect(mfx - 14, mfy - fortH + 4, 28, 8); // window
      ctx.fillStyle = era >= 4 ? "#7c4dff" : "#ff6f00";
      ctx.fillRect(mfx - 3, mfy - fortH + 5, 6, 4); // glow
      // Crenellations
      for (let ci = 0; ci < 5; ci++) {
        ctx.fillStyle = fortC;
        ctx.fillRect(mfx - 20 + ci * 10, mfy - fortH - 8, 6, 5);
      }
      // Flag
      ctx.fillStyle = "#d50000";
      ctx.fillRect(mfx, mfy - fortH - 16, 1, 14);
      ctx.fillStyle = era >= 3 ? "#d50000" : "#bf360c";
      ctx.beginPath();
      ctx.moveTo(mfx + 1, mfy - fortH - 16);
      ctx.lineTo(mfx + 12, mfy - fortH - 12);
      ctx.lineTo(mfx + 1, mfy - fortH - 8);
      ctx.fill();
      // Fort label
      ctx.fillStyle = "#e0e0e0";
      ctx.font = "bold 5px monospace";
      ctx.textAlign = "center";
      ctx.fillText("🏴 FIENDE-FORT", mfx, mfy + 8);
      // (🧠 IQ-visning fjernet — monstrene skal ikke "vises som smartere")
      // Wall rendering (if castle has wall upgrade)
      if (g.wall && g.wall.hp > 0) {
        const wx = g.wall.wx || CX + 35,
          wh = 50 + g.wall.maxHp / 8;
        const wHpP = g.wall.hp / g.wall.maxHp;
        // Wall body
        ctx.fillStyle = "#5d4037";
        ctx.fillRect(wx - 6, GY - wh, 12, wh);
        // Wall top with battlements
        ctx.fillStyle = "#4e342e";
        ctx.fillRect(wx - 8, GY - wh, 5, 8);
        ctx.fillRect(wx - 2, GY - wh, 5, 8);
        ctx.fillRect(wx + 4, GY - wh, 5, 8);
        // HP bar
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(wx - 15, GY - wh - 10, 30, 5);
        ctx.fillStyle = wHpP > 0.5 ? "#66bb6a" : wHpP > 0.25 ? "#ffa726" : "#ef5350";
        ctx.fillRect(wx - 15, GY - wh - 10, 30 * wHpP, 5);
        // Spike wall indicator
        if (g.wall.spikes) {
          ctx.fillStyle = "#ef5350";
          for (let s = -2; s <= 2; s++) ctx.fillRect(wx + s * 3 - 1, GY - wh - 6, 2, 7);
        }
      }
      // Barricade (slower enemies)
      if (g.barricade) {
        const bx = CX + 52;
        ctx.fillStyle = "#5d4037";
        for (let i = 0; i < 3; i++) ctx.fillRect(bx + i * 8 - 1, GY - 12, 4, 12);
        ctx.fillStyle = "#8d6e63";
        ctx.fillRect(bx - 2, GY - 14, 28, 4);
      }
      // Moat (visual)
      if (g.moat) {
        ctx.fillStyle = "rgba(20,40,80,0.6)";
        ctx.fillRect(CX + 40, GY - 4, 30, 8);
        ctx.fillStyle = "rgba(30,60,120,0.4)";
        ctx.fillRect(CX + 40, GY - 4, 30, 4);
      }
      // Castle (med valgfri skin)
      const nf = g.floors.length,
        cw = 64,
        ctY = GY - 24 - nf * FH;
      const skin = CASTLE_SKINS[g.castleSkin || ""];
      if (skin && typeof skin.drawFn === "function") {
        // ÷ Custom drawing-funksjon — full kontroll
        try {
          skin.drawFn(ctx, CX, GY, nf, g.tick || 0);
        } catch(e) {
          // Fallback til standard hvis drawFn krasjer
          console.warn("Skin drawFn feilet:", e);
          const cG2 = ctx.createLinearGradient(CX - cw / 2, 0, CX + cw / 2, 0);
          cG2.addColorStop(0, "#2e2518");
          cG2.addColorStop(0.5, "#7a6b55");
          cG2.addColorStop(1, "#2e2518");
          ctx.fillStyle = cG2;
          ctx.fillRect(CX - cw / 2, ctY, cw, GY - ctY);
        }
      } else {
        // ÷ Standard / gradient-skin
        const cG = ctx.createLinearGradient(CX - cw / 2, 0, CX + cw / 2, 0);
        if (skin && skin.gradient) {
          cG.addColorStop(0, skin.gradient[0]);
          cG.addColorStop(0.5, skin.gradient[1] || skin.gradient[0]);
          cG.addColorStop(1, skin.gradient[2] || skin.gradient[0]);
        } else {
          cG.addColorStop(0, "#2e2518");
          cG.addColorStop(0.5, "#7a6b55");
          cG.addColorStop(1, "#2e2518");
        }
        ctx.fillStyle = cG;
        ctx.fillRect(CX - cw / 2, ctY, cw, GY - ctY);
        // Castle turret (built-in weapon)
        ctx.fillStyle = (skin && skin.turretColor) || "#5d4037";
        ctx.fillRect(CX - 5, ctY - 10, 10, 12);
        ctx.fillStyle = (skin && skin.glowColor) || "#ffd54f";
        ctx.fillRect(CX - 2, ctY - 8, 4, 4); // glow
        if (g.castleCd <= 5) {
          ctx.fillStyle = "rgba(255,213,79,0.3)";
          ctx.beginPath();
          ctx.arc(CX, ctY - 5, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // ═══════ STANDARD-TÅRN-DELER ═══════
      // Disse tegnes BARE når skin ikke har drawFn (drawFn-skins tegner alt selv)
      const hasCustomDraw = skin && typeof skin.drawFn === "function";
      if (!hasCustomDraw) {
        // Door
        ctx.fillStyle = "#2a1a10";
        ctx.beginPath();
        ctx.moveTo(CX - 8, GY);
        ctx.lineTo(CX - 8, GY - 18);
        ctx.arc(CX, GY - 18, 8, Math.PI, 0);
        ctx.lineTo(CX + 8, GY);
        ctx.fill();
        // Floors
        for (let fi = 0; fi < nf; fi++) {
          const fy = slotY(fi, 0);
          ctx.fillStyle = "#6d5f4e";
          ctx.fillRect(CX - cw / 2 - 8, fy - 2, cw + 22, 3);
        }
        // Battlements
        ctx.fillStyle = "#5d4e37";
        for (let b = 0; b < 7; b++) ctx.fillRect(CX - cw / 2 + b * 10, ctY - 10, 6, 12);
        // Crystal
        const crY = ctY - 40;
        const cP = Math.sin(t * 0.04) * 0.3;
        ctx.fillStyle = "#42a5f5";
        ctx.beginPath();
        ctx.moveTo(CX, crY - 12);
        ctx.lineTo(CX + 6, crY);
        ctx.lineTo(CX, crY + 8);
        ctx.lineTo(CX - 6, crY);
        ctx.fill();
        ctx.fillStyle = `rgba(66,165,245,${0.08 + cP * 0.03})`;
        ctx.beginPath();
        ctx.arc(CX, crY, 14, 0, Math.PI * 2);
        ctx.fill();
      }
      // Wall
      if (g.wall && g.wall.hp > 0) {
        const wx = g.wall.wx || CX + 35;
        const wallH = ~~(130 * (g.wall.hp / g.wall.maxHp));
        ctx.fillStyle = "#5d4037";
        ctx.fillRect(wx - 5, GY - wallH, 10, wallH);
        ctx.fillStyle = "#6d4c41";
        for (let wy = GY - wallH; wy < GY; wy += 12) ctx.fillRect(wx - 5, wy, 10, 8);
        ctx.fillStyle = "#42a5f5";
        ctx.fillRect(wx - 5, GY - wallH - 3, 10, 3);
        const wp = g.wall.hp / g.wall.maxHp;
        ctx.fillStyle = wp > 0.5 ? "#4caf50" : wp > 0.25 ? "#ffa726" : "#ef5350";
        ctx.fillRect(wx - 5, GY - wallH - 3, 10 * wp, 3);
      }
      // Barricade
      if (g.barricade) {
        const bx = CX + 25;
        ctx.fillStyle = "#795548";
        for (let ci = 0; ci < 3; ci++) {
          ctx.beginPath();
          ctx.arc(bx + ci * 8 - 8, GY - 6, 5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#5d4037";
        ctx.fillRect(bx - 12, GY - 3, 24, 4);
      }
      // HP bar
      const hbw = cw + 20;
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(CX - hbw / 2, GY + 12, hbw, 8);
      const hpP = Math.max(0, g.hp / g.maxHp);
      ctx.fillStyle = hpP > 0.5 ? "#66bb6a" : hpP > 0.25 ? "#ffa726" : "#ef5350";
      if (hpP > 0) ctx.fillRect(CX - hbw / 2 + 1, GY + 13, (hbw - 2) * hpP, 6);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 6px monospace";
      ctx.textAlign = "center";
      ctx.fillText(`${g.hp}/${g.maxHp}`, CX, GY + 19);
      // Floor weapon indicators
      if (g.floorWpn) {
        const fw = FLOOR_WEAPONS.find(f => f.id === g.floorWpn);
        for (let fi = 0; fi < g.floors.length; fi++) {
          const fy = GY - 28 - fi * 32;
          ctx.fillStyle = `${fw.c}40`;
          ctx.fillRect(CX + 28, fy - 10, 12, 12);
          ctx.fillStyle = "#fff";
          ctx.font = "9px monospace";
          ctx.textAlign = "center";
          ctx.fillText(fw.icon, CX + 34, fy);
          if ((g.floorWpnCds || [])[fi] <= 3) {
            ctx.fillStyle = `${fw.c}80`;
            ctx.beginPath();
            ctx.arc(CX + 34, fy - 5, 5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      // Heroes on castle — si=0 center (above door), si=1 left side, si=2 right side
      for (let fi = 0; fi < g.floors.length; fi++) {
        for (let si = 0; si < 3; si++) {
          const h = g.floors[fi][si];
          if (!h) continue;
          // Position: si=0→center above door, si=1→left, si=2→right
          const offsets = [-1, -22, 20]; // x offsets from CX
          const sx = CX + offsets[si] - 10,
            sy = slotY(fi, si) - 14;
          const hd = HEROES[h.type];
          const spr = (hd && hd.sprite) ? hd.sprite : buildHeroSprite(h.type);
          if (h.hp > 0) {
            // ÷ Element-trio: regnbue-puls når alle 3 magikere er plassert
            if (h.elementalActive) {
              const t = (g.tick || 0) * 0.08;
              const rPulse = 0.6 + 0.4 * Math.sin(t);
              const rcol = h.type === "flammemagiker" ? "#ff5722"
                         : h.type === "vannmagiker"   ? "#03a9f4"
                         : "#8d6e63";
              const eAura = ctx.createRadialGradient(sx + 10, sy + 12, 4, sx + 10, sy + 12, 24);
              eAura.addColorStop(0, rcol + "AA");
              eAura.addColorStop(0.6, rcol + "44");
              eAura.addColorStop(1, rcol + "00");
              ctx.globalAlpha = rPulse;
              ctx.fillStyle = eAura;
              ctx.beginPath();
              ctx.arc(sx + 10, sy + 12, 24, 0, Math.PI * 2);
              ctx.fill();
              ctx.globalAlpha = 1;
            }
            // ÷ Stjernehelt: glødende gylden aura
            if (h.type === "stjernehelt") {
              const pulse = 0.5 + 0.5 * Math.sin((g.tick || 0) * 0.06);
              const aura = ctx.createRadialGradient(sx + 10, sy + 12, 4, sx + 10, sy + 12, 22);
              aura.addColorStop(0, "rgba(255,215,0," + (0.35 * pulse + 0.15) + ")");
              aura.addColorStop(1, "rgba(255,215,0,0)");
              ctx.fillStyle = aura;
              ctx.beginPath();
              ctx.arc(sx + 10, sy + 12, 22, 0, Math.PI * 2);
              ctx.fill();
              // Lille stjerne på toppen
              ctx.fillStyle = "#ffd700";
              ctx.font = "bold 9px monospace";
              ctx.textAlign = "center";
              ctx.fillText("⭐", sx + 10, sy - 1);
            }
            ctx.drawImage(spr, sx, sy, spr.width * 0.45, spr.height * 0.45);
            if (h.hasS) {
              ctx.fillStyle = "rgba(255,213,79,0.08)";
              ctx.beginPath();
              ctx.arc(sx + 10, sy + 10, 10, 0, Math.PI * 2);
              ctx.fill();
            }
            // HP bar — small, above hero
            if (h.maxHp > 0) {
              const bw = 18,
                bh = 3;
              ctx.fillStyle = "rgba(0,0,0,0.6)";
              ctx.fillRect(sx + 1, sy - 5, bw, bh);
              const hp = h.hp / h.maxHp;
              ctx.fillStyle = hp > 0.5 ? "#4caf50" : hp > 0.25 ? "#ffa726" : "#ef5350";
              ctx.fillRect(sx + 1, sy - 5, bw * hp, bh);
              ctx.strokeStyle = "rgba(0,0,0,0.4)";
              ctx.lineWidth = 0.5;
              ctx.strokeRect(sx + 1, sy - 5, bw, bh);
            }
          } else {
            // DEAD — greyed + respawn timer
            ctx.globalAlpha = 0.3;
            ctx.drawImage(spr, sx, sy, spr.width * 0.45, spr.height * 0.45);
            ctx.globalAlpha = 1;
            const pct = (h.deadTimer || 0) / (h.rsp || 600);
            ctx.strokeStyle = "#4fc3f7";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(sx + 8, sy + 8, 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
            ctx.stroke();
            ctx.fillStyle = "#ef5350";
            ctx.font = "bold 5px monospace";
            ctx.textAlign = "center";
            ctx.fillText("💀", sx + 8, sy + 12);
          }
        }
      }
      // ═══ SUMMONED CREATURES ═══
      for (const s of g.summons) {
        const pulse = Math.sin(s.life * 0.1) * 0.15;
        const bob = Math.sin(s.life * 0.08) * 1.5;
        const sx = s.x,
          sy = s.y + bob;
        const px = (x, y, w, h, c) => {
          ctx.fillStyle = c;
          ctx.fillRect(x, y, w, h);
        };
        // Shadow
        ctx.fillStyle = "rgba(0,0,0,0.25)";
        ctx.beginPath();
        ctx.ellipse(s.x, s.y + 2, s.w * 0.4, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        // Glow aura
        const grd = ctx.createRadialGradient(sx, sy - s.h / 2, 2, sx, sy - s.h / 2, s.w * 0.8);
        grd.addColorStop(0, s.c + "55");
        grd.addColorStop(1, s.c + "00");
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(sx, sy - s.h / 2, s.w * 0.8, 0, Math.PI * 2);
        ctx.fill();
        if (s.type === "demon" || s.type === "hellfire") {
          const hf = s.type === "hellfire";
          const bc = hf ? "#c62828" : "#b71c1c";
          const hc = hf ? "#ff6f00" : "#d32f2f";
          // Legs
          px(sx - 6, sy - 6, 4, 6, "#4e342e");
          px(sx + 2, sy - 6, 4, 6, "#4e342e");
          // Muscular body
          px(sx - 8, sy - s.h + 8, 16, s.h - 14, bc);
          px(sx - 10, sy - s.h + 10, 4, 8, bc);
          px(sx + 6, sy - s.h + 10, 4, 8, bc); // wide shoulders
          // Chest detail
          px(sx - 5, sy - s.h + 12, 10, 3, hc);
          // Head
          px(sx - 5, sy - s.h + 2, 10, 8, "#3e2723");
          // Horns (curved)
          px(sx - 7, sy - s.h - 2, 3, 5, hf ? "#ffa000" : "#ef6c00");
          px(sx - 8, sy - s.h - 4, 2, 3, hf ? "#ffc107" : "#ff8f00");
          px(sx + 4, sy - s.h - 2, 3, 5, hf ? "#ffa000" : "#ef6c00");
          px(sx + 5, sy - s.h - 4, 2, 3, hf ? "#ffc107" : "#ff8f00");
          // Glowing eyes
          ctx.fillStyle = "#ffeb3b";
          ctx.fillRect(sx - 3, sy - s.h + 4, 2, 2);
          ctx.fillRect(sx + 2, sy - s.h + 4, 2, 2);
          ctx.fillStyle = "#fff";
          ctx.fillRect(sx - 2, sy - s.h + 4, 1, 1);
          ctx.fillRect(sx + 3, sy - s.h + 4, 1, 1);
          // Mouth (snarl)
          px(sx - 2, sy - s.h + 7, 5, 1, "#ff6f00");
          // Claws
          px(sx - 12, sy - s.h + 18, 3, 2, "#ffab00");
          px(sx + 9, sy - s.h + 18, 3, 2, "#ffab00");
          // Fire aura
          if (s.life % 5 === 0) {
            for (let i = 0; i < 2; i++) g.parts.push({
              x: sx + rn(-8, 8),
              y: sy - s.h + rn(-5, 5),
              vx: rn(-1, 1),
              vy: rn(-3, -1),
              life: 14,
              c: hf ? "#ff6f00" : "#d50000",
              r: rn(2, 4)
            });
          }
          // Wing stubs
          ctx.fillStyle = bc + "99";
          ctx.beginPath();
          ctx.moveTo(sx - 10, sy - s.h + 10);
          ctx.lineTo(sx - 16, sy - s.h + 4);
          ctx.lineTo(sx - 8, sy - s.h + 14);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(sx + 10, sy - s.h + 10);
          ctx.lineTo(sx + 16, sy - s.h + 4);
          ctx.lineTo(sx + 8, sy - s.h + 14);
          ctx.fill();
        } else if (s.type === "zombie") {
          // Tattered legs
          px(sx - 4, sy - 5, 3, 5, "#4a148c");
          px(sx + 1, sy - 5, 3, 5, "#4a148c");
          // Ragged body
          px(sx - 5, sy - s.h + 5, 10, s.h - 10, "#6a1b9a");
          // Torn sleeve arms
          px(sx - 7, sy - s.h + 7, 3, 8, "#7b1fa2");
          px(sx + 5, sy - s.h + 7, 3, 8, "#7b1fa2");
          // Outstretched hands
          px(sx - 8, sy - s.h + 14, 2, 3, "#9575cd");
          px(sx + 7, sy - s.h + 14, 2, 3, "#9575cd");
          // Head
          px(sx - 4, sy - s.h + 1, 8, 6, "#9575cd");
          // Messy hair
          px(sx - 4, sy - s.h - 1, 2, 3, "#4a148c");
          px(sx + 0, sy - s.h - 1, 2, 2, "#4a148c");
          px(sx + 3, sy - s.h, 1, 2, "#4a148c");
          // Hollow eyes
          ctx.fillStyle = "#e040fb";
          ctx.fillRect(sx - 2, sy - s.h + 3, 2, 2);
          ctx.fillRect(sx + 1, sy - s.h + 3, 2, 2);
          // Mouth
          px(sx - 1, sy - s.h + 6, 3, 1, "#311b92");
          // Decay particles
          if (s.life % 20 === 0) g.parts.push({
            x: sx + rn(-5, 5),
            y: sy - s.h / 2,
            vx: rn(-0.5, 0.5),
            vy: -0.5,
            life: 15,
            c: "#b39ddb",
            r: 1
          });

        React.createElement('button', {style:s.btn, onClick:submitReset}, '📨 Send til Brage'),

function MathQuestion(props) {
  var q=props.q, streak=props.streak, onCorrect=props.onCorrect, onWrong=props.onWrong, onSkip=props.onSkip;
